<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Drift 3D</title>
    <style>
      :root {
        --bg1: #070b17;
        --bg2: #101b33;
        --panel: rgba(11, 17, 30, 0.7);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #eaf6ff;
        --accent: #6ee7ff;
        --accent2: #a78bfa;
        --gold: #ffd166;
        --danger: #ff5d8f;
        --good: #7ef29a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, #14213d 0%, var(--bg1) 52%, #020611 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .game-shell {
        position: relative;
        width: min(94vw, 1000px);
        height: min(72vw, 560px);
        max-height: 560px;
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.14);
        background: linear-gradient(180deg, #0f1b34 0%, #152a49 30%, #0f1120 100%);
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #0b1020 0%, #132844 38%, #1a254b 100%);
      }

      .hud {
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
        z-index: 10;
      }

      .stat {
        background: rgba(9, 15, 26, 0.42);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(6px);
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(3, 7, 18, 0.45);
        z-index: 20;
      }

      .overlay.hidden { display: none; }

      .panel {
        width: min(80%, 420px);
        background: rgba(12, 17, 30, 0.8);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 22px;
        padding: 28px 24px 22px;
        text-align: center;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      }

      .panel h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3.5vw, 3.3rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .panel p {
        margin: 0 0 18px;
        color: rgba(234, 246, 255, 0.9);
        line-height: 1.5;
        font-size: 1rem;
      }

      .primary-btn {
        border: none;
        background: linear-gradient(180deg, #7dd3fc, #7c3aed);
        color: white;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 14px 26px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 16px 30px rgba(124, 58, 237, 0.35);
        transition: transform 0.15s ease;
      }

      .primary-btn:hover { transform: translateY(-2px); }
      .primary-btn:active { transform: translateY(1px); }

      .message {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        padding: 10px 18px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-radius: 999px;
        background: rgba(7, 12, 22, 0.52);
        border: 1px solid rgba(255,255,255,0.1);
        z-index: 12;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Best: <span id="bestScore">0</span></div>
      </div>

      <div id="startOverlay" class="overlay">
        <div class="panel">
          <h1>Neon Drift</h1>
          <p>Thread the glowing lanes, dodge barriers, and grab energy gems.</p>
          <button id="playButton" class="primary-btn">Play</button>
        </div>
      </div>

      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div id="message" class="message">Use A/D or ← → to move</div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('bestScore');
      const messageEl = document.getElementById('message');
      const overlay = document.getElementById('startOverlay');
      const playButton = document.getElementById('playButton');

      const lanePositions = [-1.7, 0, 1.7];
      const roadDepth = 1500;

      const state = {
        running: false,
        over: false,
        score: 0,
        best: Number(localStorage.getItem('neon-drift-best') || 0),
        speed: 200,
        spawnTimer: 0,
        gemTimer: 0,
        flash: 0,
        lastTime: 0
      };

      const player = {
        lane: 1,
        targetLane: 1,
        y: 0,
        vy: 0,
        jump: 0,
        onGround: true
      };

      const obstacles = [];
      const gems = [];
      const sparks = [];

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function updateBest() {
        if (state.score > state.best) {
          state.best = Math.floor(state.score);
          localStorage.setItem('neon-drift-best', String(state.best));
        }
        bestEl.textContent = state.best;
      }

      function resetGame() {
        state.running = true;
        state.over = false;
        state.score = 0;
        state.speed = 220;
        state.spawnTimer = 0;
        state.gemTimer = 0;
        state.flash = 0;
        obstacles.length = 0;
        gems.length = 0;
        sparks.length = 0;
        player.lane = 1;
        player.targetLane = 1;
        player.y = 0;
        player.vy = 0;
        player.jump = 0;
        player.onGround = true;
        scoreEl.textContent = '0';
        messageEl.textContent = 'Stay alive';
        overlay.classList.add('hidden');
      }

      function endGame() {
        state.running = false;
        state.over = true;
        updateBest();
        messageEl.textContent = 'Crashed! Press Space';
        overlay.classList.remove('hidden');
        document.querySelector('.panel h1').textContent = 'Game Over';
        document.querySelector('.panel p').textContent = 'You clipped the traffic. Try another run.';
        playButton.textContent = 'Play Again';
      }

      function resetOverlayText() {
        document.querySelector('.panel h1').textContent = 'Neon Drift';
        document.querySelector('.panel p').textContent = 'Thread the glowing lanes, dodge barriers, and grab energy gems.';
        playButton.textContent = 'Play';
      }

      function spawnObstacle() {
        const lane = Math.floor(Math.random() * 3);
        const kind = Math.random() < 0.7 ? 'block' : 'barrier';
        obstacles.push({
          lane,
          z: roadDepth + 60,
          kind,
          width: 1.35,
          height: kind === 'block' ? 1.7 : 2.2,
          depth: 1.4
        });
      }

      function spawnGem() {
        const lane = Math.floor(Math.random() * 3);
        gems.push({ lane, z: roadDepth + 100, collected: false });
      }

      function addBurst(x, y, color, amount = 18) {
        for (let i = 0; i < amount; i++) {
          sparks.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 20 + Math.random() * 18,
            size: 2 + Math.random() * 4,
            color
          });
        }
      }

      function performJump() {
        if (!state.running || state.over) return;
        if (player.onGround) {
          player.vy = 620;
          player.onGround = false;
        }
      }

      function setLane(direction) {
        if (!state.running || state.over) return;
        player.targetLane = clamp(player.targetLane + direction, 0, 2);
      }

      function handleInput(event) {
        if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
          event.preventDefault();
          if (!state.running) {
            resetOverlayText();
            resetGame();
          } else {
            performJump();
          }
          return;
        }

        if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
          event.preventDefault();
          setLane(-1);
        }

        if (event.code === 'ArrowRight' || event.code === 'KeyD') {
          event.preventDefault();
          setLane(1);
        }
      }

      function projectWorld(x, y, z) {
        const horizonY = 170;
        const scale = 1 - z / (roadDepth + 480);
        const screenX = canvas.width / 2 + x * (160 + scale * 360);
        const screenY = lerp(horizonY, canvas.height - 40, 1 - scale);
        return {
          x: screenX,
          y: screenY - y * (120 + scale * 260),
          scale
        };
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#070b17');
        sky.addColorStop(0.22, '#132849');
        sky.addColorStop(0.58, '#20406e');
        sky.addColorStop(1, '#0d1425');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const moonX = canvas.width * 0.76;
        const moonY = 80;
        const moonGlow = ctx.createRadialGradient(moonX, moonY, 18, moonX, moonY, 140);
        moonGlow.addColorStop(0, 'rgba(255,255,255,0.96)');
        moonGlow.addColorStop(0.2, 'rgba(191,224,255,0.8)');
        moonGlow.addColorStop(1, 'rgba(117,163,255,0)');
        ctx.fillStyle = moonGlow;
        ctx.fillRect(moonX - 110, moonY - 110, 220, 220);

        ctx.fillStyle = 'rgba(150, 175, 255, 0.14)';
        for (let i = 0; i < 60; i++) {
          const x = ((i * 79) % canvas.width) + (i % 2) * 10;
          const y = ((i * 53) % 200) + 8;
          ctx.fillRect(x, y, 2, 2);
        }

        for (let i = 0; i < 6; i++) {
          const x = i * 170 + 60;
          const mountainHeight = 70 + (i % 2) * 30;
          ctx.fillStyle = i % 2 ? 'rgba(24,35,58,0.8)' : 'rgba(18,27,44,0.8)';
          ctx.beginPath();
          ctx.moveTo(x, 260);
          ctx.lineTo(x + 85, 190 - mountainHeight);
          ctx.lineTo(x + 160, 260);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawRoad() {
        const centerX = canvas.width / 2;
        const horizonY = 170;

        for (let i = 0; i < 32; i++) {
          const t1 = i / 32;
          const t2 = (i + 1) / 32;
          const y1 = lerp(horizonY, canvas.height, t1 * t1);
          const y2 = lerp(horizonY, canvas.height, t2 * t2);
          const width1 = lerp(95, canvas.width * 0.78, t1);
          const width2 = lerp(95, canvas.width * 0.78, t2);

          ctx.fillStyle = i % 2 === 0 ? '#121f36' : '#1b2c4b';
          ctx.beginPath();
          ctx.moveTo(centerX - width1 / 2, y1);
          ctx.lineTo(centerX + width1 / 2, y1);
          ctx.lineTo(centerX + width2 / 2, y2);
          ctx.lineTo(centerX - width2 / 2, y2);
          ctx.closePath();
          ctx.fill();
        }

        for (let i = 0; i < 22; i++) {
          const t = i / 22;
          const y = lerp(horizonY, canvas.height, t * t);
          const width = lerp(60, canvas.width * 0.62, t);
          ctx.strokeStyle = 'rgba(255,255,255,0.24)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(centerX - width / 2, y);
          ctx.lineTo(centerX + width / 2, y);
          ctx.stroke();
        }

        for (let i = 0; i < 7; i++) {
          const x = centerX - 170 + i * 60;
          const laneLineY = 220 + i * 48;
          ctx.strokeStyle = 'rgba(255,255,255,0.20)';
          ctx.beginPath();
          ctx.moveTo(x, laneLineY);
          ctx.lineTo(x + 20, laneLineY + 28);
          ctx.stroke();
        }
      }

      function drawObstacle(obs) {
        const laneOffset = lanePositions[obs.lane];
        const norm = 1 - obs.z / roadDepth;
        const screenX = canvas.width / 2 + laneOffset * (150 + norm * 240);
        const width = 34 + norm * 74;
        const height = 32 + norm * 72;
        const y = lerp(180, canvas.height - 70, 1 - norm * 0.92);

        const color = obs.kind === 'block' ? '#ff5d8f' : '#6ee7ff';
        ctx.fillStyle = color;
        ctx.fillRect(screenX - width / 2, y - height, width, height);

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(screenX - width / 2 + 6, y - height + 10, width - 12, 8);

        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 3;
        ctx.strokeRect(screenX - width / 2, y - height, width, height);
      }

      function drawGem(gem) {
        const laneOffset = lanePositions[gem.lane];
        const norm = 1 - gem.z / roadDepth;
        const x = canvas.width / 2 + laneOffset * (150 + norm * 240);
        const y = lerp(190, canvas.height - 100, 1 - norm * 0.92);
        const size = 10 + norm * 18;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((performance.now() * 0.01) % (Math.PI * 2));
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const angle = ((Math.PI / 2) * i) + Math.PI / 4;
          ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawPlayer() {
        const targetX = canvas.width / 2 + player.lane * 150;
        const baseY = canvas.height - 72;
        const bob = Math.sin(performance.now() * 0.012) * 3;
        const lift = player.jump * 0.8;

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(targetX, baseY + 18, 40, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7c3aed';
        ctx.fillRect(targetX - 28, baseY - 30 - lift + bob, 56, 24);

        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(targetX - 20, baseY - 52 - lift + bob, 40, 26);

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(targetX - 18, baseY - 57 - lift + bob, 12, 10);
        ctx.fillRect(targetX + 6, baseY - 57 - lift + bob, 12, 10);

        ctx.fillStyle = '#111827';
        ctx.fillRect(targetX - 14, baseY - 46 - lift + bob, 8, 8);
        ctx.fillRect(targetX + 6, baseY - 46 - lift + bob, 8, 8);

        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(targetX - 16, baseY - 4 - lift + bob);
        ctx.lineTo(targetX - 28, baseY + 18 - lift + bob);
        ctx.moveTo(targetX + 16, baseY - 4 - lift + bob);
        ctx.lineTo(targetX + 28, baseY + 18 - lift + bob);
        ctx.stroke();
      }

      function drawParticles() {
        for (const particle of sparks) {
          ctx.globalAlpha = Math.max(0, particle.life / 30);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        ctx.globalAlpha = 1;
      }

      function render() {
        drawBackground();
        drawRoad();

        for (const gem of gems) drawGem(gem);
        for (const obs of obstacles) drawObstacle(obs);
        drawParticles();
        drawPlayer();
      }

      function update(dt) {
        state.score += dt * 18;
        state.speed += dt * 4.5;
        state.spawnTimer += dt;
        state.gemTimer += dt;

        player.lane = lerp(player.lane, player.targetLane, 0.18);

        if (state.spawnTimer > 0.78) {
          spawnObstacle();
          state.spawnTimer = 0;
        }

        if (state.gemTimer > 1.2) {
          spawnGem();
          state.gemTimer = 0;
        }

        if (!player.onGround) {
          player.vy -= 1200 * dt;
          player.jump += player.vy * dt;
          if (player.jump <= 0) {
            player.jump = 0;
            player.vy = 0;
            player.onGround = true;
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.z -= state.speed * dt;

          const sameLane = Math.abs(obs.lane - player.targetLane) < 0.55;
          const nearPlayer = obs.z < 120 && obs.z > 0;
          if (sameLane && nearPlayer && player.jump < 0.9) {
            addBurst(canvas.width / 2 + player.lane * 150, canvas.height - 100, '#ff5d8f', 30);
            endGame();
            return;
          }

          if (obs.z < -80) obstacles.splice(i, 1);
        }

        for (let i = gems.length - 1; i >= 0; i--) {
          const gem = gems[i];
          gem.z -= state.speed * dt;

          const sameLane = Math.abs(gem.lane - player.targetLane) < 0.55;
          const nearPlayer = gem.z < 120 && gem.z > 0;

          if (sameLane && nearPlayer) {
            state.score += 30;
            addBurst(canvas.width / 2 + player.lane * 150, canvas.height - 120, '#ffd166', 14);
            gems.splice(i, 1);
            continue;
          }

          if (gem.z < -80) gems.splice(i, 1);
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const spark = sparks[i];
          spark.x += spark.vx;
          spark.y += spark.vy;
          spark.life -= 1;
          if (spark.life <= 0) sparks.splice(i, 1);
        }

        scoreEl.textContent = Math.floor(state.score);
        updateBest();
      }

      function loop(timestamp) {
        const dt = Math.min((timestamp - (state.lastTime || timestamp)) / 1000, 0.033);
        state.lastTime = timestamp;

        if (state.running) update(dt);
        render();
        requestAnimationFrame(loop);
      }

      playButton.addEventListener('click', () => {
        resetOverlayText();
        resetGame();
      });

      window.addEventListener('keydown', handleInput);
      window.addEventListener('pointerdown', (event) => {
        if (event.clientX < canvas.width / 2) {
          setLane(-1);
        } else {
          setLane(1);
        }

        if (!state.running) {
          resetOverlayText();
          resetGame();
        } else {
          performJump();
        }
      });

      updateBest();
      render();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
