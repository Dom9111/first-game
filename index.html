<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Lab | Photo Editor</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-2: #111827;
        --bg-3: #1a2333;
        --panel: #191f2d;
        --panel-2: #1f2937;
        --panel-3: #242f3f;
        --tool-panel: #171d2a;
        --line: rgba(148, 163, 184, 0.16);
        --line-2: rgba(148, 163, 184, 0.28);
        --text: #edf4ff;
        --muted: #9ca9bd;
        --muted-2: #70819f;
        --accent: #57d7ff;
        --accent-2: #8b5cf6;
        --orange: #f6b74d;
        --green: #37d39a;
        --red: #ff667d;
        --shadow: rgba(2, 6, 23, 0.7);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(87, 215, 255, 0.08), transparent 18%),
          radial-gradient(circle at top right, rgba(139, 92, 246, 0.08), transparent 24%),
          linear-gradient(180deg, #0a0f17 0%, #0d1117 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: stretch;
      }

      button, input {
        font: inherit;
      }

      .app {
        width: 100%;
        min-height: 100vh;
        display: grid;
        grid-template-rows: 38px 58px minmax(0, 1fr);
        background: linear-gradient(180deg, #101721 0%, #0d1117 100%);
        border: 1px solid var(--line);
      }

      .menu-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 18px;
        background: rgba(18, 24, 35, 0.96);
        border-bottom: 1px solid var(--line);
      }

      .app-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--text);
      }

      .app-mark {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 14px rgba(87, 215, 255, 0.35);
      }

      .menu-items {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      .menu-items span {
        cursor: default;
        opacity: 0.9;
      }

      .menu-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mini-chip {
        border: 1px solid var(--line);
        background: rgba(148, 163, 184, 0.05);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .options-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 12px 7px;
        border-bottom: 1px solid var(--line);
        background: rgba(17, 24, 35, 0.94);
      }

      .tool-strip,
      .utility-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tool-btn,
      .utility-btn,
      .preset-btn,
      .action-btn,
      .menu-button,
      .panel-button {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(148, 163, 184, 0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .tool-btn:hover,
      .utility-btn:hover,
      .preset-btn:hover,
      .action-btn:hover,
      .menu-button:hover,
      .panel-button:hover {
        border-color: rgba(87, 215, 255, 0.4);
        background: rgba(87, 215, 255, 0.08);
      }

      .tool-btn.active,
      .utility-btn.active,
      .panel-button.primary,
      .action-btn.primary,
      .preset-btn.primary {
        background: linear-gradient(135deg, rgba(87, 215, 255, 0.2), rgba(139, 92, 246, 0.22));
        border-color: rgba(87, 215, 255, 0.4);
      }

      .workspace {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr) 340px;
        min-height: 0;
      }

      .tool-panel {
        background: linear-gradient(180deg, #141b27 0%, #101820 100%);
        border-right: 1px solid var(--line);
        padding: 14px 10px;
      }

      .tool-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .tool-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(148, 163, 184, 0.02);
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .tool-icon:hover,
      .tool-icon.active {
        border-color: rgba(87, 215, 255, 0.4);
        background: linear-gradient(135deg, rgba(87, 215, 255, 0.12), rgba(139, 92, 246, 0.15));
        box-shadow: inset 0 0 0 1px rgba(87, 215, 255, 0.08);
      }

      .tool-separator {
        width: 56px;
        height: 1px;
        background: var(--line);
        margin: 4px 0;
      }

      .studio-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: rgba(12, 17, 26, 0.9);
      }

      .canvas-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px 10px;
        border-bottom: 1px solid var(--line);
      }

      .doc-name {
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .canvas-shell {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: linear-gradient(180deg, rgba(12, 17, 26, 0.9), rgba(9, 14, 21, 0.95));
      }

      .canvas-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 420px;
        background:
          linear-gradient(45deg, rgba(17, 24, 39, 0.8) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(17, 24, 39, 0.8) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(17, 24, 39, 0.8) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(17, 24, 39, 0.8) 75%);
        background-size: 26px 26px;
        background-position: 0 0, 0 13px, 13px -13px, -13px 0;
        border: 1px solid var(--line-2);
        border-radius: 18px;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: rgba(10, 15, 21, 0.85);
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.8rem;
        font-weight: 800;
        text-align: center;
        opacity: 1;
        transition: 0.2s ease;
      }

      .empty-state.hidden {
        opacity: 0;
      }

      .properties-panel {
        background: rgba(17, 24, 35, 0.95);
        border-left: 1px solid var(--line);
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card {
        background: rgba(22, 29, 41, 0.95);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .card-body {
        padding: 12px;
      }

      .dropzone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 130px;
        border: 1.2px dashed rgba(87, 215, 255, 0.45);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(87, 215, 255, 0.06), rgba(139, 92, 246, 0.08));
        cursor: pointer;
        padding: 16px 12px;
        text-align: center;
        transition: 0.2s ease;
      }

      .dropzone:hover,
      .dropzone.dragging {
        border-color: rgba(87, 215, 255, 0.8);
        background: linear-gradient(180deg, rgba(87, 215, 255, 0.09), rgba(139, 92, 246, 0.1));
      }

      .dropzone .icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(87, 215, 255, 0.2), rgba(139, 92, 246, 0.2));
        font-size: 1.15rem;
      }

      .dropzone strong {
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dropzone span {
        color: var(--muted);
        font-size: 0.7rem;
        line-height: 1.5;
      }

      .quick-actions,
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .control {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }

      .control:last-child {
        margin-bottom: 0;
      }

      .control label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .control output {
        color: var(--text);
        min-width: 36px;
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #57d7ff;
      }

      .layers {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .layers li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(148, 163, 184, 0.03);
      }

      .layers li.active {
        border-color: rgba(87, 215, 255, 0.35);
        background: rgba(87, 215, 255, 0.06);
      }

      .layer-label {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mini-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(55, 211, 154, 0.8);
      }

      .mini-dot.orange { background: var(--orange); box-shadow: 0 0 12px rgba(246, 183, 77, 0.8); }
      .mini-dot.purple { background: var(--accent-2); box-shadow: 0 0 12px rgba(139, 92, 246, 0.8); }
      .mini-dot.red { background: var(--red); box-shadow: 0 0 12px rgba(255, 102, 125, 0.8); }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        background: rgba(148, 163, 184, 0.03);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }

      .stat .label {
        color: var(--muted);
        font-size: 0.56rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .stat .value {
        font-weight: 800;
        font-size: 0.84rem;
      }

      @media (max-width: 1100px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .tool-panel {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .tool-stack {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }

        .properties-panel {
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="menu-bar">
        <div class="app-title">
          <div class="app-mark"></div>
          <span>Pixel Lab</span>
        </div>

        <div class="menu-items">
          <span>File</span>
          <span>Edit</span>
          <span>Image</span>
          <span>Layer</span>
          <span>Type</span>
          <span>Filter</span>
          <span>View</span>
          <span>Window</span>
          <span>Help</span>
        </div>

        <div class="menu-actions">
          <button class="mini-chip" type="button">PSD</button>
          <button class="mini-chip" type="button">Saved</button>
        </div>
      </header>

      <div class="options-bar">
        <div class="tool-strip">
          <button type="button" class="tool-btn active">Move</button>
          <button type="button" class="tool-btn">Marquee</button>
          <button type="button" class="tool-btn">Lasso</button>
          <button type="button" class="tool-btn">Magic Wand</button>
          <button type="button" class="tool-btn">Crop</button>
          <button type="button" class="tool-btn">Brush</button>
          <button type="button" class="tool-btn">Clone</button>
        </div>

        <div class="utility-strip">
          <button type="button" class="utility-btn" id="zoomOutBtn">− Zoom</button>
          <button type="button" class="utility-btn" id="zoomInBtn">+ Zoom</button>
          <button type="button" class="utility-btn active" id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="workspace">
        <aside class="tool-panel">
          <div class="tool-stack">
            <div class="tool-icon active" title="Move Tool">✥</div>
            <div class="tool-icon" title="Select">◼</div>
            <div class="tool-icon" title="Crop">⌖</div>
            <div class="tool-icon" title="Brush">✎</div>
            <div class="tool-icon" title="Eraser">⌫</div>
            <div class="tool-icon" title="Clone">⎇</div>
            <div class="tool-separator"></div>
            <div class="tool-icon" title="Gradient">◫</div>
            <div class="tool-icon" title="Text">T</div>
            <div class="tool-icon" title="Eye Dropper">◉</div>
          </div>
        </aside>

        <main class="studio-panel">
          <div class="canvas-header">
            <div class="doc-name">Untitled-1.psd</div>
            <div class="utility-strip">
              <button type="button" class="panel-button">View</button>
              <button type="button" class="panel-button primary">Export</button>
            </div>
          </div>

          <div class="canvas-shell">
            <div class="canvas-wrap">
              <canvas id="editorCanvas" width="1200" height="760"></canvas>
              <div class="empty-state" id="emptyState">Drop a photo to begin editing</div>
            </div>
          </div>
        </main>

        <aside class="properties-panel">
          <div class="card">
            <div class="card-header">
              <span>Import</span>
              <span>Drop</span>
            </div>
            <div class="card-body">
              <label class="dropzone" id="dropZone" for="imageLoader">
                <input id="imageLoader" type="file" accept="image/*" hidden />
                <div class="icon">⬆</div>
                <strong>Drop image</strong>
                <span>or click to browse</span>
              </label>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Adjustments</span>
            </div>
            <div class="card-body">
              <div class="control">
                <label for="brightness"><span>Brightness</span><output id="brightnessValue">100%</output></label>
                <input id="brightness" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="contrast"><span>Contrast</span><output id="contrastValue">100%</output></label>
                <input id="contrast" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="saturation"><span>Saturation</span><output id="saturationValue">100%</output></label>
                <input id="saturation" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="warmth"><span>Warmth</span><output id="warmthValue">0%</output></label>
                <input id="warmth" type="range" min="-100" max="100" value="0" />
              </div>
              <div class="control">
                <label for="blur"><span>Blur</span><output id="blurValue">0px</output></label>
                <input id="blur" type="range" min="0" max="10" value="0" step="0.5" />
              </div>
              <div class="control">
                <label for="grayscale"><span>Mono</span><output id="grayscaleValue">0%</output></label>
                <input id="grayscale" type="range" min="0" max="100" value="0" />
              </div>
              <div class="control">
                <label for="hue"><span>Hue</span><output id="hueValue">0°</output></label>
                <input id="hue" type="range" min="0" max="360" value="0" />
              </div>
              <div class="control">
                <label for="vignette"><span>Vignette</span><output id="vignetteValue">0%</output></label>
                <input id="vignette" type="range" min="0" max="100" value="0" />
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Presets</span>
            </div>
            <div class="card-body presets">
              <button type="button" class="preset-btn primary" data-preset="original">Original</button>
              <button type="button" class="preset-btn" data-preset="vivid">Vivid</button>
              <button type="button" class="preset-btn" data-preset="cinematic">Cinematic</button>
              <button type="button" class="preset-btn" data-preset="mono">Mono</button>
              <button type="button" class="preset-btn" data-preset="warm">Warm</button>
              <button type="button" class="preset-btn" data-preset="cool">Cool</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Layers</span>
            </div>
            <div class="card-body">
              <ul class="layers">
                <li class="active"><span class="layer-label"><span class="mini-dot"></span> Background</span><span>Locked</span></li>
                <li><span class="layer-label"><span class="mini-dot orange"></span> Highlights</span><span>5%</span></li>
                <li><span class="layer-label"><span class="mini-dot purple"></span> Glow</span><span>12%</span></li>
                <li><span class="layer-label"><span class="mini-dot red"></span> Mask</span><span>Off</span></li>
              </ul>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Info</span>
            </div>
            <div class="card-body meta-grid">
              <div class="stat">
                <div class="label">Zoom</div>
                <div class="value" id="zoomValue">100%</div>
              </div>
              <div class="stat">
                <div class="label">Rotate</div>
                <div class="value" id="rotationValue">0°</div>
              </div>
              <div class="stat">
                <div class="label">Format</div>
                <div class="value" id="formatValue">None</div>
              </div>
              <div class="stat">
                <div class="label">Quality</div>
                <div class="value">8/10</div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('editorCanvas');
      const ctx = canvas.getContext('2d');
      const emptyState = document.getElementById('emptyState');
      const dropZone = document.getElementById('dropZone');
      const imageLoader = document.getElementById('imageLoader');

      const controls = {
        brightness: document.getElementById('brightness'),
        contrast: document.getElementById('contrast'),
        saturation: document.getElementById('saturation'),
        warmth: document.getElementById('warmth'),
        blur: document.getElementById('blur'),
        grayscale: document.getElementById('grayscale'),
        hue: document.getElementById('hue'),
        vignette: document.getElementById('vignette')
      };

      const outputs = {
        brightness: document.getElementById('brightnessValue'),
        contrast: document.getElementById('contrastValue'),
        saturation: document.getElementById('saturationValue'),
        warmth: document.getElementById('warmthValue'),
        blur: document.getElementById('blurValue'),
        grayscale: document.getElementById('grayscaleValue'),
        hue: document.getElementById('hueValue'),
        vignette: document.getElementById('vignetteValue')
      };

      const state = {
        image: null,
        zoom: 1,
        rotation: 0,
        flipX: false,
        flipY: false,
        panX: 0,
        panY: 0,
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function buildFilterString() {
        const brightness = Number(controls.brightness.value);
        const contrast = Number(controls.contrast.value);
        const saturation = Number(controls.saturation.value);
        const grayscale = Number(controls.grayscale.value);
        const blur = Number(controls.blur.value);
        const hue = Number(controls.hue.value);
        const warmth = Number(controls.warmth.value);

        let warmthFilter = 'saturate(1)';
        if (warmth > 0) warmthFilter = `saturate(${1 + warmth / 200})`;
        if (warmth < 0) warmthFilter = `saturate(${1 + warmth / 300})`;

        return [
          `brightness(${brightness}%)`,
          `contrast(${contrast}%)`,
          `saturate(${saturation}%)`,
          `grayscale(${grayscale}%)`,
          `hue-rotate(${hue}deg)`,
          `blur(${blur}px)`,
          warmthFilter
        ].join(' ');
      }

      function updateOutputs() {
        outputs.brightness.textContent = `${controls.brightness.value}%`;
        outputs.contrast.textContent = `${controls.contrast.value}%`;
        outputs.saturation.textContent = `${controls.saturation.value}%`;
        outputs.warmth.textContent = `${controls.warmth.value}%`;
        outputs.blur.textContent = `${Number(controls.blur.value).toFixed(1)}px`;
        outputs.grayscale.textContent = `${controls.grayscale.value}%`;
        outputs.hue.textContent = `${controls.hue.value}°`;
        outputs.vignette.textContent = `${controls.vignette.value}%`;
        document.getElementById('zoomValue').textContent = `${Math.round(state.zoom * 100)}%`;
        document.getElementById('rotationValue').textContent = `${state.rotation}°`;
      }

      function renderCanvas() {
        updateOutputs();
        const { width, height } = canvas;
        ctx.clearRect(0, 0, width, height);

        if (!state.image) {
          return;
        }

        const img = state.image;
        const maxWidth = width * 0.82;
        const maxHeight = height * 0.76;
        const aspectRatio = img.width / img.height;

        let drawWidth = maxWidth;
        let drawHeight = drawWidth / aspectRatio;

        if (drawHeight > maxHeight) {
          drawHeight = maxHeight;
          drawWidth = drawHeight * aspectRatio;
        }

        drawWidth *= state.zoom;
        drawHeight *= state.zoom;

        const offsetX = width / 2 + state.panX;
        const offsetY = height / 2 + state.panY;

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.rotate((state.rotation * Math.PI) / 180);
        ctx.scale(state.flipX ? -1 : 1, state.flipY ? -1 : 1);
        ctx.translate(-drawWidth / 2, -drawHeight / 2);
        ctx.filter = buildFilterString();
        ctx.drawImage(img, 0, 0, drawWidth, drawHeight);
        ctx.restore();

        const vignetteAmount = Number(controls.vignette.value) / 100;
        if (vignetteAmount > 0) {
          const gradient = ctx.createRadialGradient(
            width / 2,
            height / 2,
            Math.min(width, height) * 0.16,
            width / 2,
            height / 2,
            Math.max(width, height) * 0.72
          );

          gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
          gradient.addColorStop(1, `rgba(0, 0, 0, ${0.42 + vignetteAmount * 0.65})`);
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function updateImageMetadata(fileName) {
        document.getElementById('formatValue').textContent = fileName ? fileName.split('.').pop().toUpperCase() : 'None';
      }

      function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) {
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.image = img;
            emptyState.classList.add('hidden');
            updateImageMetadata(file.name);
            renderCanvas();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }

      function handleFiles(files) {
        const file = files && files[0];
        handleImageFile(file);
      }

      Object.values(controls).forEach((input) => {
        input.addEventListener('input', renderCanvas);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        Object.entries(controls).forEach(([key, input]) => {
          if (key === 'brightness') input.value = 100;
          if (key === 'contrast') input.value = 100;
          if (key === 'saturation') input.value = 100;
          if (key === 'warmth') input.value = 0;
          if (key === 'blur') input.value = 0;
          if (key === 'grayscale') input.value = 0;
          if (key === 'hue') input.value = 0;
          if (key === 'vignette') input.value = 0;
        });

        state.zoom = 1;
        state.rotation = 0;
        state.flipX = false;
        state.flipY = false;
        state.panX = 0;
        state.panY = 0;
        renderCanvas();
      });

      document.getElementById('rotateLeftBtn')?.addEventListener('click', () => {
        state.rotation = (state.rotation - 90 + 360) % 360;
        renderCanvas();
      });

      document.getElementById('rotateRightBtn')?.addEventListener('click', () => {
        state.rotation = (state.rotation + 90) % 360;
        renderCanvas();
      });

      document.getElementById('flipHBtn')?.addEventListener('click', () => {
        state.flipX = !state.flipX;
        renderCanvas();
      });

      document.getElementById('flipVBtn')?.addEventListener('click', () => {
        state.flipY = !state.flipY;
        renderCanvas();
      });

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        state.zoom = clamp(state.zoom + 0.1, 0.5, 2.5);
        renderCanvas();
      });

      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        state.zoom = clamp(state.zoom - 0.1, 0.5, 2.5);
        renderCanvas();
      });

      document.querySelector('.panel-button.primary')?.addEventListener('click', () => {
        if (!state.image) return;

        const exportCanvas = document.createElement('canvas');
        const img = state.image;
        const exportCtx = exportCanvas.getContext('2d');

        const ratio = img.width / img.height;
        const width = 2000;
        const height = Math.round(width / ratio);

        exportCanvas.width = width;
        exportCanvas.height = height;

        exportCtx.clearRect(0, 0, width, height);
        exportCtx.save();
        exportCtx.translate(width / 2, height / 2);
        exportCtx.rotate((state.rotation * Math.PI) / 180);
        exportCtx.scale(state.flipX ? -1 : 1, state.flipY ? -1 : 1);
        exportCtx.filter = buildFilterString();
        exportCtx.drawImage(img, -width / 2, -height / 2, width, height);
        exportCtx.restore();

        const vignetteAmount = Number(controls.vignette.value) / 100;
        if (vignetteAmount > 0) {
          const gradient = exportCtx.createRadialGradient(
            width / 2,
            height / 2,
            Math.min(width, height) * 0.18,
            width / 2,
            height / 2,
            Math.max(width, height) * 0.75
          );
          gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
          gradient.addColorStop(1, `rgba(0, 0, 0, ${0.45 + vignetteAmount * 0.55})`);
          exportCtx.fillStyle = gradient;
          exportCtx.fillRect(0, 0, width, height);
        }

        const link = document.createElement('a');
        link.download = 'edited-photo.png';
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
      });

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => {
          const preset = button.dataset.preset;
          const presets = {
            original: { brightness: 100, contrast: 100, saturation: 100, warmth: 0, blur: 0, grayscale: 0, hue: 0, vignette: 0 },
            vivid: { brightness: 110, contrast: 125, saturation: 150, warmth: 12, blur: 0, grayscale: 0, hue: 0, vignette: 4 },
            cinematic: { brightness: 95, contrast: 135, saturation: 105, warmth: 18, blur: 0.5, grayscale: 0, hue: 8, vignette: 18 },
            mono: { brightness: 108, contrast: 120, saturation: 20, warmth: 0, blur: 0, grayscale: 78, hue: 0, vignette: 8 },
            warm: { brightness: 112, contrast: 120, saturation: 130, warmth: 30, blur: 0, grayscale: 0, hue: 12, vignette: 6 },
            cool: { brightness: 96, contrast: 110, saturation: 90, warmth: -20, blur: 0, grayscale: 0, hue: 190, vignette: 10 }
          };

          const values = presets[preset];
          Object.entries(values).forEach(([key, value]) => {
            controls[key].value = value;
          });

          renderCanvas();
        });
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add('dragging');
        });
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove('dragging');
        });
      });

      dropZone.addEventListener('drop', (event) => {
        handleFiles(event.dataTransfer.files);
      });

      imageLoader.addEventListener('change', (event) => {
        handleFiles(event.target.files);
      });

      document.querySelectorAll('.tool-icon').forEach((tool) => {
        tool.addEventListener('click', () => {
          document.querySelectorAll('.tool-icon').forEach((item) => item.classList.remove('active'));
          tool.classList.add('active');
        });
      });

      renderCanvas();
    </script>
  </body>
</html>
