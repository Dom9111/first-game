<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>Friendly Neighborhood — A Spider-Hero Animation</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f7ff; --muted:#a8b6ca; --red:#e43b45; --blue:#1456a0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 0%,#1b3555 0,#0a1422 45%,#050a12 100%); }
    .frame { width:min(1120px,100%); }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 2px 14px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .mark { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; color:white; background:linear-gradient(145deg,#fa525b,#a90f23); box-shadow:0 5px 22px #e43b4544; font-size:18px; }
    .live { color:#b8c5d8; font-size:10px; letter-spacing:.15em; text-transform:uppercase; }
    .live i { display:inline-block; width:7px; height:7px; margin-right:8px; border-radius:50%; background:#7ce6c0; box-shadow:0 0 12px #7ce6c0; }
    .scene { position:relative; overflow:hidden; border:1px solid #53678166; border-radius:18px; background:#091422; box-shadow:0 28px 90px #0009, inset 0 1px #ffffff12; }
    canvas { display:block; width:100%; aspect-ratio:16/9; }
    .caption { position:absolute; left:clamp(18px,4vw,48px); top:clamp(18px,4vw,44px); pointer-events:none; text-shadow:0 2px 22px #07111f; }
    .eyebrow { color:#ff747a; font-size:10px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; }
    h1 { margin:9px 0 7px; font-size:clamp(24px,4.6vw,48px); line-height:.97; letter-spacing:-.055em; }
    .sub { margin:0; color:#c2ccda; font-size:clamp(10px,1.35vw,13px); }
    .controls { position:absolute; right:18px; bottom:17px; display:flex; align-items:center; gap:10px; }
    .controls span { color:#d5deeb; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    button { display:grid; place-items:center; width:40px; height:40px; border:1px solid #ffffff3b; border-radius:50%; color:white; background:#101c2dbb; backdrop-filter:blur(8px); cursor:pointer; transition:transform .18s,background .18s; }
    button:hover { transform:scale(1.07); background:#253852; }
    button:focus-visible { outline:2px solid #ff747a; outline-offset:3px; }
    button svg { width:15px; height:15px; }
    .footer { display:flex; justify-content:space-between; gap:20px; margin:12px 3px 0; color:#8292a8; font-size:10px; }
    @media(max-width:600px) { body{padding:12px}.scene{border-radius:12px}.caption{left:16px;top:15px}.eyebrow{font-size:8px}.sub{max-width:180px;line-height:1.4}.controls{right:10px;bottom:10px}.controls span{display:none}.footer{font-size:9px} }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">✳</span> Friendly Neighborhood</div>
      <div class="live"><i></i>New York · after dark</div>
    </header>
    <section class="scene" aria-label="Animated superhero swinging over a New York city skyline">
      <canvas id="scene" aria-label="A red-and-blue spider-themed hero swings between city buildings at night"></canvas>
      <div class="caption"><div class="eyebrow">A little more than friendly</div><h1>THE CITY<br>IS YOURS.</h1><p class="sub">One more swing before sunrise.</p></div>
      <div class="controls"><span id="motionLabel">Animation playing</span><button id="toggle" type="button" aria-label="Pause animation" title="Pause animation"><svg id="toggleIcon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg></button></div>
    </section>
    <div class="footer"><span>AN ORIGINAL SPIDER-HERO TRIBUTE</span><span>Press space or use the pause button</span></div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const toggle = document.getElementById('toggle');
  const icon = document.getElementById('toggleIcon');
  const motionLabel = document.getElementById('motionLabel');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduceMotion;
  let startedAt = performance.now();
  let pauseAt = startedAt;
  const W = 1200, H = 675;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function roundedRect(x,y,w,h,r,fill) {
    ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function line(x1,y1,x2,y2,color,width) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.stroke();
  }
  function city(seed, x, base, width, height, color, windows=true) {
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.moveTo(x,base); ctx.lineTo(x,base-height+12);
    let step=0;
    while (step<width) {
      const notch=12+((seed*19+step*7)%29);
      ctx.lineTo(x+step,base-height+(step===0?0:notch));
      step+=18+((seed+step)%17);
      ctx.lineTo(x+Math.min(step,width),base-height+(step===0?0:notch));
    }
    ctx.lineTo(x+width,base); ctx.closePath(); ctx.fill();
    if(windows) {
      for(let wx=x+9;wx<x+width-5;wx+=17) for(let wy=base-height+24;wy<base-15;wy+=25) {
        const lit=((Math.floor(wx*3+wy*7+seed*31)%9)<3);
        if(lit) { ctx.fillStyle=(seed%2?'#f6c875':'#9bc7e8'); ctx.globalAlpha=.3+((wx+wy)%4)*.1; ctx.fillRect(wx,wy,4,8); }
      }
      ctx.globalAlpha=1;
    }
  }
  function drawBackground(t) {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#101e38'); sky.addColorStop(.52,'#172a43'); sky.addColorStop(1,'#34445a');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    const glow=ctx.createRadialGradient(870,150,10,870,150,380);
    glow.addColorStop(0,'#eb9d7930'); glow.addColorStop(1,'#eb9d7900'); ctx.fillStyle=glow; ctx.fillRect(450,0,750,500);
    ctx.fillStyle='#f4e7c9'; ctx.globalAlpha=.86; ctx.beginPath(); ctx.arc(926,119,38,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#17263c'; ctx.beginPath(); ctx.arc(943,105,36,0,Math.PI*2); ctx.fill();
    for(let i=0;i<75;i++) {
      const x=(i*173+31)%W, y=(i*83+21)%310;
      ctx.globalAlpha=.25+((i*13)%7)*.07; ctx.fillStyle='#e7eefb'; ctx.fillRect(x,y,1.5,1.5);
    }
    ctx.globalAlpha=1;
    const drift=(t*.025)%150;
    for(let i=0;i<12;i++) city(i+2,i*120-drift,520,132,110+((i*47)%130),'#18283d');
    for(let i=0;i<13;i++) city(i+17,i*105-((t*.055)%105),590,119,150+((i*31)%145),'#101d30');
    // Rooftops framing the swing
    city(41,-35,675,240,290,'#0b1728',false);
    city(53,1000,675,260,350,'#0a1626',false);
    ctx.fillStyle='#23374b'; ctx.fillRect(0,590,W,85);
    // A few rooftop silhouettes and warm windows
    for(let i=0;i<18;i++) {
      const x=(i*79+14)%W; const y=610+(i*19)%54;
      ctx.fillStyle=i%3===0?'#e7aa5c':'#52718b'; ctx.globalAlpha=.34; ctx.fillRect(x,y,3,7);
    }
    ctx.globalAlpha=1;
    const haze=ctx.createLinearGradient(0,420,0,640); haze.addColorStop(0,'#91a7bd00'); haze.addColorStop(1,'#9babc51c'); ctx.fillStyle=haze; ctx.fillRect(0,400,W,260);
  }
  function spiderEmblem() {
    ctx.save(); ctx.translate(0,-20); ctx.strokeStyle='#101b2a'; ctx.lineWidth=3; ctx.lineCap='round';
    line(-2,-3,-12,-14,'#101b2a',3); line(-4,0,-17,-3,'#101b2a',3); line(-3,4,-13,15,'#101b2a',3);
    line(2,-3,12,-14,'#101b2a',3); line(4,0,17,-3,'#101b2a',3); line(3,4,13,15,'#101b2a',3);
    ctx.beginPath(); ctx.ellipse(0,0,4,8,0,0,Math.PI*2); ctx.fillStyle='#101b2a'; ctx.fill(); ctx.restore();
  }
  function drawHero(x,y,tilt,t) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
    // Thin cinematic rim light
    ctx.shadowColor='#69bfff99'; ctx.shadowBlur=22;
    // Web line hand
    const armWave=Math.sin(t*2.7)*7;
    line(-4,-37,-43,-94+armWave,'#d7e5f1',2.2);
    ctx.shadowBlur=0;
    // Legs in a tucked, airborne pose
    line(-8,26,-32,58,'#b82232',17); line(-32,58,-57,68,'#b82232',15);
    line(9,27,34,53,'#0b417f',18); line(34,53,53,47,'#c92b3a',15);
    // Boot accents
    line(-60,68,-49,70,'#111d2b',5); line(49,47,59,45,'#111d2b',5);
    // Torso silhouette and blue suit
    ctx.beginPath(); ctx.moveTo(-17,-42); ctx.quadraticCurveTo(-25,-20,-16,17); ctx.lineTo(-8,38); ctx.quadraticCurveTo(8,43,20,29); ctx.lineTo(22,-12); ctx.quadraticCurveTo(18,-36,12,-44); ctx.closePath();
    const suit=ctx.createLinearGradient(-18,-35,20,35); suit.addColorStop(0,'#e9434b'); suit.addColorStop(.45,'#d92f3e'); suit.addColorStop(.46,'#145ba3'); suit.addColorStop(1,'#0b3268'); ctx.fillStyle=suit; ctx.fill();
    ctx.strokeStyle='#101c2a'; ctx.lineWidth=2; ctx.stroke();
    // Chest web arcs and spider mark
    ctx.save(); ctx.beginPath(); ctx.rect(-19,-38,42,76); ctx.clip();
    ctx.strokeStyle='#ff9b9d88'; ctx.lineWidth=.85;
    for(let yy=-34;yy<5;yy+=10) { ctx.beginPath(); ctx.moveTo(-22,yy); ctx.quadraticCurveTo(0,yy+9,24,yy); ctx.stroke(); }
    for(let xx=-24;xx<25;xx+=10) { ctx.beginPath(); ctx.moveTo(xx,-44); ctx.quadraticCurveTo(xx-7,-10,xx+5,9); ctx.stroke(); }
    ctx.restore(); spiderEmblem();
    // Arms: one reaching toward the web, one trailing behind
    line(-13,-34,-29,-57,'#d83342',14); line(-29,-57,-43,-94+armWave,'#d83342',12);
    line(14,-30,37,-12,'#12569b',15); line(37,-12,48,8,'#d83342',12);
    // Gloves
    ctx.fillStyle='#151f2c'; ctx.beginPath(); ctx.arc(-43,-94+armWave,6,0,Math.PI*2); ctx.fill();
    // Neck and mask
    ctx.fillStyle='#c92d3c'; roundedRect(-7,-51,14,15,5,'#c92d3c');
    const head=ctx.createRadialGradient(-7,-76,2,0,-74,26); head.addColorStop(0,'#f14b53'); head.addColorStop(1,'#a8172b');
    ctx.fillStyle=head; ctx.beginPath(); ctx.ellipse(0,-76,20,25,-.08,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#111d2b'; ctx.lineWidth=2; ctx.stroke();
    // Mask web pattern
    ctx.strokeStyle='#691928'; ctx.lineWidth=.8;
    for(let a=-2;a<=2;a++) { ctx.beginPath(); ctx.moveTo(a*7,-98); ctx.lineTo(a*8,-55); ctx.stroke(); }
    for(let yy=-91;yy<-60;yy+=8) { ctx.beginPath(); ctx.ellipse(0,yy,17-(Math.abs(yy+76)*.08),4,0,0,Math.PI*2); ctx.stroke(); }
    // Expressive white lenses
    ctx.fillStyle='#f2f4ee'; ctx.strokeStyle='#17202c'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-17,-81); ctx.quadraticCurveTo(-9,-87,-3,-80); ctx.lineTo(-6,-70); ctx.quadraticCurveTo(-13,-69,-17,-75); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(17,-81); ctx.quadraticCurveTo(9,-87,3,-80); ctx.lineTo(6,-70); ctx.quadraticCurveTo(13,-69,17,-75); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function drawWeb(anchorX,anchorY,handX,handY,t) {
    ctx.save(); ctx.strokeStyle='#d9e8f4'; ctx.lineWidth=1.5; ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.moveTo(anchorX,anchorY); ctx.quadraticCurveTo(anchorX+14,anchorY+42,handX,handY); ctx.stroke();
    // A subtle glint travelling along the strand
    const p=(t*1.6)%1; const gx=anchorX+(handX-anchorX)*p, gy=anchorY+(handY-anchorY)*p;
    ctx.fillStyle='#fff'; ctx.globalAlpha=.8; ctx.beginPath(); ctx.arc(gx,gy,2,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  function draw(t) {
    const rect=canvas.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
    drawBackground(t);
    // Foreground rooftop ledges add depth
    ctx.fillStyle='#07111f'; ctx.beginPath(); ctx.moveTo(0,650); ctx.lineTo(0,611); ctx.lineTo(170,611); ctx.lineTo(202,638); ctx.lineTo(292,638); ctx.lineTo(320,675); ctx.lineTo(0,675); ctx.fill();
    ctx.fillStyle='#0a1525'; ctx.beginPath(); ctx.moveTo(930,675); ctx.lineTo(965,625); ctx.lineTo(1077,625); ctx.lineTo(1104,601); ctx.lineTo(1200,601); ctx.lineTo(1200,675); ctx.fill();
    const swing=Math.sin(t*1.05);
    const x=705+swing*220;
    const y=218+Math.cos(t*1.05)*82;
    const tilt=.22+swing*.32;
    const handX=x-43*Math.cos(tilt)-(-94+Math.sin(t*2.7)*7)*Math.sin(tilt);
    const handY=y-43*Math.sin(tilt)+(-94+Math.sin(t*2.7)*7)*Math.cos(tilt);
    drawWeb(822,12,handX,handY,t);
    // Speed streaks behind the hero
    ctx.globalAlpha=.16; ctx.strokeStyle='#d7e9ff'; ctx.lineWidth=2;
    for(let i=0;i<5;i++){ const sy=y-50+i*25; ctx.beginPath(); ctx.moveTo(x-180-i*13,sy); ctx.lineTo(x-115-i*9,sy-7); ctx.stroke(); }
    ctx.globalAlpha=1;
    drawHero(x,y,tilt,t);
    // Gentle vignette and film-like grain flecks
    const vignette=ctx.createRadialGradient(W/2,H/2,170,W/2,H/2,760); vignette.addColorStop(0,'#00000000'); vignette.addColorStop(1,'#0207119c'); ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff'; ctx.globalAlpha=.035;
    for(let i=0;i<45;i++){ const px=(i*277+Math.floor(t*9))%W, py=(i*149+Math.floor(t*13))%H; ctx.fillRect(px,py,1,1); }
    ctx.globalAlpha=1;
  }
  function frame(now) {
    if(!paused) draw((now-startedAt)/1000);
    requestAnimationFrame(frame);
  }
  function setPaused(value) {
    if(value===paused) return;
    paused=value;
    if(paused) pauseAt=performance.now();
    else startedAt+=performance.now()-pauseAt;
    motionLabel.textContent=paused?'Animation paused':'Animation playing';
    toggle.setAttribute('aria-label',paused?'Play animation':'Pause animation');
    toggle.title=paused?'Play animation':'Pause animation';
    icon.innerHTML=paused?'<path d="M5 2.8v10.4c0 .6.7.9 1.2.6l7.5-5.2a.7.7 0 0 0 0-1.2l-7.5-5.2A.7.7 0 0 0 5 2.8Z"/>':'<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
  }
  toggle.addEventListener('click',()=>setPaused(!paused));
  window.addEventListener('keydown',event=>{ if(event.code==='Space' && !['BUTTON','INPUT'].includes(document.activeElement.tagName)){ event.preventDefault(); setPaused(!paused); } });
  if(paused) {
    motionLabel.textContent='Animation paused';
    toggle.setAttribute('aria-label','Play animation');
    toggle.title='Play animation';
    icon.innerHTML='<path d="M5 2.8v10.4c0 .6.7.9 1.2.6l7.5-5.2a.7.7 0 0 0 0-1.2l-7.5-5.2A.7.7 0 0 0 5 2.8Z"/>';
  }
  draw(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
