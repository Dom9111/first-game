<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch Quest</title>
    <style>
      :root {
        --bg1: #f7f2ea;
        --bg2: #e9d6bc;
        --ink: #1d2432;
        --muted: #5b6475;
        --card: rgba(255,255,255,0.8);
        --line: rgba(29,35,51,0.08);
        --easy: #4aa36a;
        --medium: #f5b942;
        --hard: #d94f3d;
        --purple: #7458d6;
        --blue: #3c7ef4;
        --shadow: rgba(25, 30, 40, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
        color: var(--ink);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 28px;
      }

      .app {
        width: min(1100px, 100%);
        border-radius: 28px;
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px var(--shadow);
        overflow: hidden;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 22px 28px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.15));
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        position: relative;
      }

      .logo::before,
      .logo::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 6px;
        border: 3px solid rgba(255,255,255,0.9);
      }

      .logo::after {
        inset: 13px 8px 8px 13px;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
        gap: 24px;
        padding: 24px 28px 28px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
      }

      .prompt-card {
        min-height: 380px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(180deg, #fffaf1 0%, #fff 100%);
      }

      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 900;
      }

      .difficulty {
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 900;
      }

      .difficulty.easy { background: rgba(74,163,106,0.12); color: var(--easy); }
      .difficulty.medium { background: rgba(245,185,66,0.14); color: #ad7f00; }
      .difficulty.hard { background: rgba(217,79,61,0.12); color: var(--hard); }

      .prompt {
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.05;
        margin: 0 0 14px;
        letter-spacing: -0.05em;
      }

      .details {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
        font-size: 1rem;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        color: white;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 12px 16px;
        cursor: pointer;
      }

      .secondary {
        background: linear-gradient(135deg, var(--red), var(--orange));
      }

      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter {
        border-radius: 999px;
        border: 1px solid var(--line);
        background: white;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        padding: 8px 12px;
        color: var(--ink);
      }

      .filter.active {
        background: linear-gradient(135deg, #f4efe9, #f0f3ff);
        border-color: rgba(116,88,214,0.3);
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 500px;
        overflow: auto;
      }

      .list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
      }

      .list li button {
        background: transparent;
        color: var(--ink);
        padding: 0;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 700;
        border-radius: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .easy-dot { background: var(--easy); }
      .medium-dot { background: var(--medium); }
      .hard-dot { background: var(--hard); }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <div class="logo"></div>
          <span>Sketch Quest</span>
        </div>
        <div class="stats">
          <div class="chip">50 prompts</div>
          <div class="chip">Easy / medium / hard</div>
        </div>
      </header>

      <div class="layout">
        <section class="panel prompt-card">
          <div>
            <div class="label-row">
              <div class="eyebrow" id="promptNumber">Prompt 1</div>
              <div class="difficulty" id="difficultyBadge">Easy</div>
            </div>
            <h1 class="prompt" id="promptText">A sleepy cat curled up on a chair</h1>
            <p class="details" id="promptHint">Quick, expressive, and easy to sketch in under 5 minutes.</p>
          </div>

          <div class="button-row">
            <button type="button" id="nextBtn">Next prompt</button>
            <button type="button" id="randomBtn" class="secondary">Random</button>
          </div>
        </section>

        <aside class="side-panel">
          <section class="panel">
            <div class="label-row">
              <div class="eyebrow">Difficulty</div>
            </div>
            <div class="filter-row">
              <button class="filter active" data-filter="all" type="button">All</button>
              <button class="filter" data-filter="easy" type="button">Easy</button>
              <button class="filter" data-filter="medium" type="button">Medium</button>
              <button class="filter" data-filter="hard" type="button">Hard</button>
            </div>
          </section>

          <section class="panel">
            <div class="label-row">
              <div class="eyebrow">Prompt list</div>
            </div>
            <ul class="list" id="promptList"></ul>
          </section>
        </aside>
      </div>
    </div>

    <script>
      const prompts = [
        { prompt: 'A sleepy cat curled up on a chair', difficulty: 'easy', hint: 'Quick, expressive, and easy to sketch in under 5 minutes.' },
        { prompt: 'A coffee cup on a rainy windowsill', difficulty: 'easy', hint: 'Simple shapes with nice mood and details.' },
        { prompt: 'A pile of colorful books', difficulty: 'easy', hint: 'Focus on stacked shapes and perspective.' },
        { prompt: 'A tiny flower growing in a cracked pot', difficulty: 'easy', hint: 'A small scene with a strong center of interest.' },
        { prompt: 'A bird sitting on a fence post', difficulty: 'easy', hint: 'Perfect for practicing silhouette and basic feather shapes.' },
        { prompt: 'A pair of sneakers on the floor', difficulty: 'easy', hint: 'Try simple outlines and light shading.' },
        { prompt: 'A backpack full of school supplies', difficulty: 'easy', hint: 'Practice volume and layered textures.' },
        { prompt: 'A stack of pancakes with syrup', difficulty: 'easy', hint: 'Great for round forms and highlights.' },
        { prompt: 'A smiling sun peeking behind clouds', difficulty: 'easy', hint: 'Clean shapes and a warm color mood.' },
        { prompt: 'A lantern hanging outside a cabin', difficulty: 'easy', hint: 'Good for light, shadow, and form.' },

        { prompt: 'A fox in a field at sunset', difficulty: 'medium', hint: 'Build the pose and use soft gradients to show depth.' },
        { prompt: 'An old bicycle leaning against a wall', difficulty: 'medium', hint: 'Work on wheels, spokes, and perspective.' },
        { prompt: 'A person walking with an umbrella', difficulty: 'medium', hint: 'Try movement and strong silhouette.' },
        { prompt: 'A cactus in a ceramic pot', difficulty: 'medium', hint: 'Focus on clean repeated shapes and textures.' },
        { prompt: 'A dragonfly resting on a leaf', difficulty: 'medium', hint: 'Tiny details and delicate line work make it interesting.' },
        { prompt: 'A bakery counter full of pastries', difficulty: 'medium', hint: 'A busy composition with lots of simple repeated forms.' },
        { prompt: 'A winter cabin in the snow', difficulty: 'medium', hint: 'Mix geometry with atmospheric light.' },
        { prompt: 'A skateboard and helmet on a bench', difficulty: 'medium', hint: 'Practice overlapping objects and proportions.' },
        { prompt: 'A hand holding a tea mug', difficulty: 'medium', hint: 'Try realistic finger shapes and contour lines.' },
        { prompt: 'A stormy beach with crashing waves', difficulty: 'medium', hint: 'Layer the forms and add motion lines.' },

        { prompt: 'A full-body portrait of a warrior in armor', difficulty: 'hard', hint: 'Use strong anatomy and detailed costume shapes.' },
        { prompt: 'A fantasy castle on a cliff at night', difficulty: 'hard', hint: 'Challenge your composition and depth.' },
        { prompt: 'A detailed city street with multiple buildings', difficulty: 'hard', hint: 'Layer perspective, windows, and lighting.' },
        { prompt: 'A horse rearing up against a dramatic sky', difficulty: 'hard', hint: 'Focus on anatomy and action lines.' },
        { prompt: 'A detailed underwater scene with fish and coral', difficulty: 'hard', hint: 'Lots of varied shapes and underwater lighting.' },
        { prompt: 'An old violin and bow on a wooden table', difficulty: 'hard', hint: 'Practice curves, wood grain, and refined forms.' },
        { prompt: 'A bustling market street with signs and people', difficulty: 'hard', hint: 'A full scene with lots of small details.' },
        { prompt: 'A dramatic portrait of a person in profile', difficulty: 'hard', hint: 'Focus on skull structure, eyes, and shadow.' },
        { prompt: 'A spaceship flying through asteroid fields', difficulty: 'hard', hint: 'Create energy, motion, and complex space forms.' },
        { prompt: 'A group of musicians in a jazz club', difficulty: 'hard', hint: 'Add multiple figures, instruments, and atmosphere.' },

        { prompt: 'A robot watering a garden', difficulty: 'easy', hint: 'Simple mechanical shapes with some personality.' },
        { prompt: 'A bowl of fruit on a kitchen table', difficulty: 'easy', hint: 'Try a variety of round forms and highlights.' },
        { prompt: 'A toy train beside a small station', difficulty: 'easy', hint: 'Study clean shapes and repeating wheels.' },
        { prompt: 'A campfire with marshmallows and logs', difficulty: 'easy', hint: 'Good practice for warm tones and circular forms.' },
        { prompt: 'A penguin standing on an iceberg', difficulty: 'easy', hint: 'Focus on silhouette and body volume.' },
        { prompt: 'A birdhouse hanging from a branch', difficulty: 'easy', hint: 'Simple object study with a little environment.' },
        { prompt: 'A stack of colorful donuts', difficulty: 'easy', hint: 'Rounded forms and frosting texture are fun and easy.' },
        { prompt: 'A little garden shed with a window', difficulty: 'medium', hint: 'Use perspective and simple architectural shapes.' },
        { prompt: 'A wolf howling at the moon', difficulty: 'medium', hint: 'Use line and form to give the creature energy.' },
        { prompt: 'A row of potted plants on a balcony', difficulty: 'medium', hint: 'Multiple objects and layered spacing.' },
        { prompt: 'A vintage camera on a desk', difficulty: 'medium', hint: 'Try strong shapes plus tiny mechanical detail.' },
        { prompt: 'Two hands drawing together on paper', difficulty: 'medium', hint: 'A challenge in proportions and gesture.' },
        { prompt: 'A mountain lake with reflections', difficulty: 'hard', hint: 'Push your values and terrain shapes.' },
        { prompt: 'A detailed portrait of an elderly person', difficulty: 'hard', hint: 'Focus on wrinkles, expression, and lighting.' },
        { prompt: 'A giant tree with roots and branches', difficulty: 'hard', hint: 'More complex structure and texture.' },
        { prompt: 'A dragon flying over a castle', difficulty: 'hard', hint: 'A full fantasy scene with many moving parts.' },
        { prompt: 'A close-up of a face with dramatic light', difficulty: 'hard', hint: 'Very challenging for form and shadow study.' }
      ];

      const state = {
        filter: 'all',
        index: 0
      };

      const promptText = document.getElementById('promptText');
      const promptHint = document.getElementById('promptHint');
      const promptNumber = document.getElementById('promptNumber');
      const difficultyBadge = document.getElementById('difficultyBadge');
      const promptList = document.getElementById('promptList');
      const filters = document.querySelectorAll('.filter');

      function getFilteredPrompts() {
        if (state.filter === 'all') return prompts;
        return prompts.filter(item => item.difficulty === state.filter);
      }

      function getCurrentPrompt() {
        const filtered = getFilteredPrompts();
        if (!filtered.length) return prompts[0];
        return filtered[Math.min(state.index, filtered.length - 1)];
      }

      function getDotClass(level) {
        if (level === 'easy') return 'easy-dot';
        if (level === 'medium') return 'medium-dot';
        return 'hard-dot';
      }

      function renderList() {
        const filtered = getFilteredPrompts();
        promptList.innerHTML = '';

        filtered.forEach((item, index) => {
          const li = document.createElement('li');
          const dot = document.createElement('span');
          dot.className = `dot ${getDotClass(item.difficulty)}`;

          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = `${index + 1}. ${item.prompt}`;
          button.addEventListener('click', () => {
            state.index = index;
            renderCurrent();
          });

          const label = document.createElement('span');
          label.textContent = item.difficulty;
          label.style.fontSize = '0.68rem';
          label.style.fontWeight = '900';
          label.style.letterSpacing = '0.08em';
          label.style.textTransform = 'uppercase';
          label.style.color = item.difficulty === 'easy' ? 'var(--easy)' : item.difficulty === 'medium' ? '#ad7f00' : 'var(--hard)';

          li.appendChild(dot);
          li.appendChild(button);
          li.appendChild(label);
          promptList.appendChild(li);
        });
      }

      function renderCurrent() {
        const filtered = getFilteredPrompts();
        const prompt = filtered.length ? filtered[Math.min(state.index, filtered.length - 1)] : prompts[0];
        const originalIndex = prompts.indexOf(prompt) + 1;

        promptText.textContent = prompt.prompt;
        promptHint.textContent = prompt.hint;
        promptNumber.textContent = `Prompt ${originalIndex}`;
        difficultyBadge.textContent = prompt.difficulty;
        difficultyBadge.className = `difficulty ${prompt.difficulty}`;

        renderList();
      }

      document.getElementById('nextBtn').addEventListener('click', () => {
        const filtered = getFilteredPrompts();
        if (!filtered.length) return;
        state.index = (state.index + 1) % filtered.length;
        renderCurrent();
      });

      document.getElementById('randomBtn').addEventListener('click', () => {
        const filtered = getFilteredPrompts();
        if (!filtered.length) return;
        state.index = Math.floor(Math.random() * filtered.length);
        renderCurrent();
      });

      filters.forEach(filter => {
        filter.addEventListener('click', () => {
          state.filter = filter.dataset.filter;
          state.index = 0;
          filters.forEach(btn => btn.classList.toggle('active', btn === filter));
          renderCurrent();
        });
      });

      renderCurrent();
    </script>
  </body>
</html>
