<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Guide</title>
    <style>
      :root {
        --bg: #f5f0e6;
        --panel: #ffffff;
        --panel-alt: #f9f3ea;
        --ink: #1d2333;
        --muted: #5b6477;
        --gold: #f5b942;
        --red: #d94f3d;
        --blue: #3c7ef4;
        --green: #4aa36a;
        --purple: #7458d6;
        --orange: #f29b38;
        --shadow: rgba(25, 30, 40, 0.12);
        --line: rgba(29, 35, 51, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f8f4eb 0%, #efe6d3 100%);
        color: var(--ink);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 28px;
      }

      .app {
        width: min(1200px, 100%);
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        background: rgba(255,255,255,0.65);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 24px 80px var(--shadow);
        overflow: hidden;
      }

      .sidebar {
        background: linear-gradient(180deg, #fffaf2 0%, #f7efe6 100%);
        padding: 24px 18px;
        border-right: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--red), var(--gold));
        position: relative;
        box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
      }

      .logo::before,
      .logo::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 6px;
        border: 3px solid rgba(255,255,255,0.85);
      }

      .logo::after {
        inset: 14px 8px 8px 14px;
      }

      .build-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .build-item {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 16px;
        padding: 12px 14px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      }

      .build-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(0,0,0,0.06);
      }

      .build-item.active {
        border-color: rgba(116, 88, 214, 0.45);
        background: linear-gradient(180deg, #f4f0ff 0%, #ffffff 100%);
      }

      .build-item h3 {
        margin: 0 0 4px;
        font-size: 1rem;
      }

      .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .content {
        padding: 28px;
      }

      .hero {
        background: linear-gradient(135deg, #ffefbf 0%, #f3d7a3 100%);
        border: 1px solid rgba(0,0,0,0.05);
        border-radius: 22px;
        padding: 22px 24px;
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(220px, 0.8fr);
        gap: 18px;
        align-items: center;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .badge {
        background: rgba(255,255,255,0.65);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 999px;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 7px 10px;
        font-weight: 800;
      }

      .mini-visual {
        height: 180px;
        border-radius: 18px;
        position: relative;
        background: linear-gradient(180deg, #e7ecff 0%, #dbe7ff 100%);
        border: 1px solid rgba(0,0,0,0.06);
        overflow: hidden;
      }

      .block {
        position: absolute;
        border-radius: 8px;
        box-shadow: inset 0 -8px 0 rgba(0,0,0,0.12);
      }

      .block.red { background: linear-gradient(180deg, #ff8b7b, #d94f3d); }
      .block.blue { background: linear-gradient(180deg, #87b8ff, #3c7ef4); }
      .block.yellow { background: linear-gradient(180deg, #ffe29a, #f5b942); }
      .block.green { background: linear-gradient(180deg, #9ee0af, #4aa36a); }
      .block.purple { background: linear-gradient(180deg, #bca8ff, #7458d6); }
      .block.gray { background: linear-gradient(180deg, #dfe7f0, #8aa0b8); }
      .block.white { background: linear-gradient(180deg, #ffffff, #dfe7f0); }

      .details-grid {
        margin-top: 24px;
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
      }

      .card h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .steps li {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        background: var(--panel-alt);
        border: 1px solid rgba(29,35,51,0.04);
        border-radius: 14px;
        padding: 10px 12px;
      }

      .step-number {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 900;
        color: white;
        background: linear-gradient(135deg, var(--purple), var(--blue));
      }

      .steps p {
        margin: 0;
        line-height: 1.5;
        color: var(--ink);
      }

      .toolbox {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .stat-box {
        background: var(--panel-alt);
        border-radius: 14px;
        border: 1px solid rgba(0,0,0,0.04);
        padding: 14px 16px;
      }

      .stat-box strong {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .stat-box span {
        font-size: 1.1rem;
        font-weight: 800;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--red), var(--orange));
        color: white;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 12px 16px;
        cursor: pointer;
      }

      .secondary {
        background: linear-gradient(135deg, var(--blue), var(--purple));
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .hero,
        .details-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo"></div>
          <span>Brick Guide</span>
        </div>
        <div class="build-list" id="buildList"></div>
      </aside>

      <main class="content">
        <section class="hero">
          <div>
            <h1 id="buildTitle">Mini Race Car</h1>
            <p class="subtitle" id="buildDescription"></p>
            <div class="badge-row" id="buildBadges"></div>
          </div>
          <div class="mini-visual" id="miniVisual"></div>
        </section>

        <div class="details-grid">
          <section class="card">
            <h2>Build Steps</h2>
            <ol class="steps" id="stepsList"></ol>
          </section>

          <aside class="card toolbox">
            <div class="stat-box">
              <strong>Pieces</strong>
              <span id="pieceCount"></span>
            </div>
            <div class="stat-box">
              <strong>Difficulty</strong>
              <span id="difficulty"></span>
            </div>
            <div class="stat-box">
              <strong>Best for</strong>
              <span id="ageGroup"></span>
            </div>
            <div class="stat-box">
              <strong>Key bricks</strong>
              <span id="keyBricks"></span>
            </div>

            <div class="button-row">
              <button id="randomBuildBtn">Random build</button>
              <button id="nextBuildBtn" class="secondary">Next build</button>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <script>
      const builds = [
        {
          id: 1,
          name: 'Mini Race Car',
          category: 'Vehicle',
          difficulty: 'Easy',
          age: '6+',
          pieces: 42,
          description: 'A fast little racer with a streamlined body, spoiler, and bold colors for a quick weekend build.',
          bricks: '2x4 plates, 2x2 tiles, wheels, spoiler',
          steps: [
            'Start with a wide baseplate and add two axles evenly spaced under the chassis.',
            'Attach the four wheels and lock them tightly so the car rolls straight.',
            'Build the cabin using stacked tiles and a small front bumper for the sporty look.',
            'Add the spoiler and a tiny windshield to finish the racer profile.',
            'Test the wheels and adjust the axle alignment for a smoother roll.'
          ],
          colors: ['red', 'yellow', 'blue']
        },
        {
          id: 2,
          name: 'Cozy Tree House',
          category: 'Town',
          difficulty: 'Medium',
          age: '7+',
          pieces: 88,
          description: 'A simple family tree house with a balcony, ladder, and warm roof details.',
          bricks: '1x2 bricks, 2x3 tiles, roof slopes, round plates',
          steps: [
            'Build the trunk as a tall central column with a few branches on each side.',
            'Add a sturdy floor platform above the trunk and widen it into a small deck.',
            'Construct the walls using stacked bricks and leave one side open for the doorway.',
            'Place the roof slopes at an angle and add a chimney for character.',
            'Finish with a tiny ladder and a balcony railing to make it feel lived in.'
          ],
          colors: ['green', 'yellow', 'brown']
        },
        {
          id: 3,
          name: 'Space Rover',
          category: 'Adventure',
          difficulty: 'Medium',
          age: '8+',
          pieces: 96,
          description: 'A moon rover with a big front light, storage pod, and durable wheel design.',
          bricks: 'round tiles, dark bricks, axle pieces, angled panels',
          steps: [
            'Create the chassis with a wide rectangular base and add the wheel mounts at all corners.',
            'Attach the front telescope arm and add a bright light panel to the front section.',
            'Build a cargo box on the back and connect it to the main body using small plates.',
            'Add side handles and antenna detail to make the rover look mission-ready.',
            'Check that both sides are balanced before displaying it proudly.'
          ],
          colors: ['blue', 'gray', 'white']
        },
        {
          id: 4,
          name: 'Pirate Ship',
          category: 'Fantasy',
          difficulty: 'Hard',
          age: '9+',
          pieces: 121,
          description: 'A compact pirate ship with sails, a deck, and a hidden chest of treasure.',
          bricks: 'slope bricks, sails, mast pieces, anchor',
          steps: [
            'Lay down the hull with a pointed front and wider back so the ship has a classic shape.',
            'Build the deck and add a tiny captain cabin close to the rear.',
            'Place the mast and secure two sail pieces using thin bars and clips.',
            'Add the anchor, flag, and a small treasure chest to the deck.',
            'Make sure the ship can stand level before displaying it on a shelf.'
          ],
          colors: ['red', 'gold', 'blue']
        },
        {
          id: 5,
          name: 'Robot Helper',
          category: 'Tech',
          difficulty: 'Easy',
          age: '6+',
          pieces: 58,
          description: 'A cheerful little robot with moving arms, bright eyes, and a helpful pose.',
          bricks: 'round plates, tiles, hinge pieces, technic bars',
          steps: [
            'Build the body as a compact box with a large front panel for the face.',
            'Add the eyes and a cheerful display panel using bright tiles.',
            'Attach two arm pieces with simple hinges so they swing naturally.',
            'Create the legs using stacked plates for a sturdy stance.',
            'Finish with a tiny accessory tray or side panel for the helper look.'
          ],
          colors: ['blue', 'yellow', 'white']
        }
      ];

      const buildList = document.getElementById('buildList');
      const buildTitle = document.getElementById('buildTitle');
      const buildDescription = document.getElementById('buildDescription');
      const buildBadges = document.getElementById('buildBadges');
      const stepsList = document.getElementById('stepsList');
      const pieceCount = document.getElementById('pieceCount');
      const difficulty = document.getElementById('difficulty');
      const ageGroup = document.getElementById('ageGroup');
      const keyBricks = document.getElementById('keyBricks');
      const miniVisual = document.getElementById('miniVisual');
      const randomBuildBtn = document.getElementById('randomBuildBtn');
      const nextBuildBtn = document.getElementById('nextBuildBtn');

      let selectedIndex = 0;

      function renderBuilds() {
        buildList.innerHTML = '';

        builds.forEach((build, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'build-item' + (index === selectedIndex ? ' active' : '');
          button.innerHTML = `
            <h3>${build.name}</h3>
            <div class="meta">
              <span>${build.category}</span>
              <span>•</span>
              <span>${build.pieces} pieces</span>
            </div>
          `;
          button.addEventListener('click', () => {
            selectedIndex = index;
            renderSelectedBuild();
          });
          buildList.appendChild(button);
        });
      }

      function renderMiniVisual(colors) {
        miniVisual.innerHTML = '';

        const paletteMap = {
          red: 'red',
          blue: 'blue',
          yellow: 'yellow',
          green: 'green',
          purple: 'purple',
          gray: 'gray',
          white: 'white',
          brown: 'red'
        };

        const shapes = [
          { left: 22, top: 62, size: 42, color: paletteMap[colors[0]] || 'red', type: 'block' },
          { left: 64, top: 46, size: 42, color: paletteMap[colors[1]] || 'yellow', type: 'block' },
          { left: 104, top: 62, size: 42, color: paletteMap[colors[2]] || 'blue', type: 'block' },
          { left: 54, top: 98, size: 24, color: 'yellow', type: 'block' },
          { left: 92, top: 98, size: 24, color: 'purple', type: 'block' }
        ];

        shapes.forEach(item => {
          const block = document.createElement('div');
          block.className = `block ${item.color}`;
          block.style.left = item.left + 'px';
          block.style.top = item.top + 'px';
          block.style.width = item.size + 'px';
          block.style.height = item.size + 'px';
          miniVisual.appendChild(block);
        });
      }

      function renderSelectedBuild() {
        const build = builds[selectedIndex];
        buildTitle.textContent = build.name;
        buildDescription.textContent = build.description;

        buildBadges.innerHTML = '';
        const badges = [build.category, build.difficulty, `${build.age}`];
        badges.forEach(text => {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = text;
          buildBadges.appendChild(badge);
        });

        stepsList.innerHTML = '';
        build.steps.forEach((step, index) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="step-number">${index + 1}</div>
            <p>${step}</p>
          `;
          stepsList.appendChild(li);
        });

        pieceCount.textContent = `${build.pieces} pieces`;
        difficulty.textContent = build.difficulty;
        ageGroup.textContent = build.age;
        keyBricks.textContent = build.bricks;

        renderMiniVisual(build.colors);
        renderBuilds();
      }

      randomBuildBtn.addEventListener('click', () => {
        const random = Math.floor(Math.random() * builds.length);
        selectedIndex = random;
        renderSelectedBuild();
      });

      nextBuildBtn.addEventListener('click', () => {
        selectedIndex = (selectedIndex + 1) % builds.length;
        renderSelectedBuild();
      });

      renderSelectedBuild();
    </script>
  </body>
</html>
