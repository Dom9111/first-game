<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Pixel Plumber</title>
    <style>
      :root {
        --sky-top: #6ad5ff;
        --sky-mid: #bbf1ff;
        --sky-bottom: #f4fbff;
        --ground: #49b548;
        --ground-dark: #2d8a32;
        --grass: #7ce76d;
        --brick: #d17a36;
        --brick-dark: #9b4d1d;
        --pipe: #1cc45f;
        --pipe-dark: #0d8d47;
        --coin: #ffd85a;
        --block: #f8d36b;
        --block-dark: #d39a32;
        --enemy: #de4c4c;
        --enemy-dark: #a52d2d;
        --shadow: rgba(0, 0, 0, 0.18);
        --panel: rgba(12, 18, 30, 0.82);
        --text: #f7fbff;
        --muted: #caebff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, #0b1221 0%, #101b2d 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .game-shell {
        width: min(96vw, 1100px);
        border: 3px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0,0,0,0.42);
        background: rgba(8, 13, 20, 0.7);
      }

      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 18px;
        background: rgba(12,18,28,0.9);
        border-bottom: 3px solid rgba(255,255,255,0.08);
      }

      .brand {
        font-size: 0.84rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .stat {
        min-width: 94px;
        text-align: center;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
      }

      .stat .label {
        display: block;
        color: var(--muted);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stat .value {
        display: block;
        margin-top: 5px;
        font-size: 1.1rem;
        font-weight: 900;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 65%, var(--sky-bottom) 100%);
      }

      .bottom-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px 16px;
        background: rgba(8, 13, 20, 0.9);
        border-top: 3px solid rgba(255,255,255,0.08);
      }

      .controls {
        color: var(--muted);
        font-size: 0.8rem;
      }

      button {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, #ffe266, #ffbf56);
        color: #1a160b;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(255, 191, 86, 0.24);
      }

      button:hover {
        filter: brightness(1.05);
      }

      @media (max-width: 700px) {
        .hud,
        .bottom-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="brand">Super Pixel Plumber</div>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
          <div class="stat"><span class="label">Coins</span><span class="value" id="coinValue">0</span></div>
          <div class="stat"><span class="label">Lives</span><span class="value" id="livesValue">3</span></div>
        </div>
      </div>

      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <div class="bottom-bar">
        <div class="controls">Move: A/D or ←/→ • Jump: W, ↑, or Space</div>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreValue = document.getElementById('scoreValue');
      const coinValue = document.getElementById('coinValue');
      const livesValue = document.getElementById('livesValue');
      const restartBtn = document.getElementById('restartBtn');

      const keys = {};

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      const world = {
        width: 3900,
        platforms: [
          { x: 0, y: 500, w: 420, h: 40, kind: 'ground' },
          { x: 500, y: 500, w: 340, h: 40, kind: 'ground' },
          { x: 950, y: 500, w: 430, h: 40, kind: 'ground' },
          { x: 1480, y: 500, w: 660, h: 40, kind: 'ground' },
          { x: 2200, y: 500, w: 430, h: 40, kind: 'ground' },
          { x: 2720, y: 500, w: 610, h: 40, kind: 'ground' },
          { x: 3400, y: 500, w: 500, h: 40, kind: 'ground' },
          { x: 200, y: 430, w: 150, h: 18, kind: 'step' },
          { x: 620, y: 390, w: 150, h: 18, kind: 'step' },
          { x: 1120, y: 430, w: 120, h: 18, kind: 'step' },
          { x: 1550, y: 360, w: 150, h: 18, kind: 'step' },
          { x: 1890, y: 420, w: 150, h: 18, kind: 'step' },
          { x: 2360, y: 350, w: 160, h: 18, kind: 'step' },
          { x: 2850, y: 395, w: 150, h: 18, kind: 'step' },
          { x: 3150, y: 330, w: 160, h: 18, kind: 'step' },
          { x: 1300, y: 440, w: 80, h: 60, kind: 'pipe' },
          { x: 1760, y: 400, w: 80, h: 100, kind: 'pipe' },
          { x: 2470, y: 420, w: 90, h: 80, kind: 'pipe' },
          { x: 2980, y: 410, w: 90, h: 90, kind: 'pipe' }
        ],
        coins: [
          { x: 310, y: 390, r: 10, collected: false },
          { x: 660, y: 350, r: 10, collected: false },
          { x: 1160, y: 390, r: 10, collected: false },
          { x: 1600, y: 320, r: 10, collected: false },
          { x: 1940, y: 380, r: 10, collected: false },
          { x: 2415, y: 310, r: 10, collected: false },
          { x: 2900, y: 355, r: 10, collected: false },
          { x: 3195, y: 290, r: 10, collected: false },
          { x: 1380, y: 390, r: 10, collected: false },
          { x: 3500, y: 460, r: 10, collected: false }
        ],
        enemies: [
          { x: 620, y: 470, w: 28, h: 30, minX: 540, maxX: 800, dir: 1, speed: 1.2, alive: true },
          { x: 1215, y: 470, w: 28, h: 30, minX: 1060, maxX: 1440, dir: 1, speed: 1.4, alive: true },
          { x: 1850, y: 470, w: 28, h: 30, minX: 1680, maxX: 2080, dir: -1, speed: 1.5, alive: true },
          { x: 2760, y: 470, w: 28, h: 30, minX: 2720, maxX: 3240, dir: 1, speed: 1.5, alive: true }
        ],
        goal: { x: 3720, y: 250, w: 14, h: 250 }
      };

      const state = {
        score: 0,
        coins: 0,
        lives: 3,
        cameraX: 0,
        status: 'title'
      };

      const player = {
        x: 70,
        y: 410,
        w: 28,
        h: 42,
        vx: 0,
        vy: 0,
        speed: 4.2,
        jumpPower: 13.5,
        onGround: false,
        facing: 1,
        invuln: 0,
        respawnX: 70,
        respawnY: 410
      };

      function updateHud() {
        scoreValue.textContent = state.score;
        coinValue.textContent = state.coins;
        livesValue.textContent = state.lives;
      }

      function resetPlayer() {
        player.x = player.respawnX;
        player.y = player.respawnY;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.invuln = 90;
      }

      function resetGame() {
        state.score = 0;
        state.coins = 0;
        state.lives = 3;
        state.cameraX = 0;
        state.status = 'title';
        player.respawnX = 70;
        player.respawnY = 410;
        world.coins.forEach((coin) => { coin.collected = false; });
        world.enemies.forEach((enemy) => { enemy.alive = true; enemy.x = enemy.minX + 10; });
        resetPlayer();
        updateHud();
      }

      function loseLife() {
        if (player.invuln > 0) return;
        state.lives -= 1;
        updateHud();

        if (state.lives <= 0) {
          state.status = 'gameover';
          return;
        }

        resetPlayer();
      }

      function collectCoin(coin) {
        if (coin.collected) return;
        const dx = player.x + player.w / 2 - coin.x;
        const dy = player.y + player.h / 2 - coin.y;
        if (Math.abs(dx) < 26 && Math.abs(dy) < 26) {
          coin.collected = true;
          state.coins += 1;
          state.score += 25;
          updateHud();
        }
      }

      function handleEnemyCollision(enemy) {
        if (!enemy.alive) return;

        const playerBox = { x: player.x + 4, y: player.y + 3, w: player.w - 8, h: player.h - 3 };
        const enemyBox = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };

        if (!rectsOverlap(playerBox, enemyBox)) return;

        const stomped = player.vy > 0 && player.y + player.h <= enemy.y + 14;
        if (stomped) {
          player.vy = -8.2;
          enemy.alive = false;
          state.score += 100;
          updateHud();
        } else {
          loseLife();
        }
      }

      function updatePlayer() {
        const left = !!keys.a || !!keys.arrowleft;
        const right = !!keys.d || !!keys.arrowright;
        const jump = !!keys.w || !!keys.arrowup || !!keys[' '];

        let move = 0;
        if (left) move -= 1;
        if (right) move += 1;

        if (move !== 0) {
          player.vx = move * player.speed;
          player.facing = move;
        } else {
          player.vx *= 0.82;
          if (Math.abs(player.vx) < 0.1) player.vx = 0;
        }

        if (jump && player.onGround) {
          player.vy = -player.jumpPower;
          player.onGround = false;
        }

        player.vy += 0.55;

        const previousX = player.x;
        player.x += player.vx;

        for (const platform of world.platforms) {
          const block = { x: platform.x, y: platform.y, w: platform.w, h: platform.h };
          if (!rectsOverlap({ x: player.x, y: player.y, w: player.w, h: player.h }, block)) continue;

          if (previousX + player.w <= platform.x + 6 && player.vx > 0) {
            player.x = platform.x - player.w;
            player.vx = 0;
          } else if (previousX >= platform.x + platform.w - 6 && player.vx < 0) {
            player.x = platform.x + platform.w;
            player.vx = 0;
          }
        }

        const previousY = player.y;
        player.y += player.vy;
        player.onGround = false;

        for (const platform of world.platforms) {
          const block = { x: platform.x, y: platform.y, w: platform.w, h: platform.h };
          if (!rectsOverlap({ x: player.x, y: player.y, w: player.w, h: player.h }, block)) continue;

          if (previousY + player.h <= platform.y + 10 && player.vy >= 0) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (previousY >= platform.y + platform.h - 10 && player.vy < 0) {
            player.y = platform.y + platform.h;
            player.vy = 0;
          }
        }

        player.x = clamp(player.x, 0, world.width - player.w);

        if (player.y > canvas.height + 120) {
          loseLife();
        }

        if (player.invuln > 0) player.invuln -= 1;
      }

      function updateEnemies() {
        for (const enemy of world.enemies) {
          if (!enemy.alive) continue;
          enemy.x += enemy.speed * enemy.dir;
          if (enemy.x <= enemy.minX || enemy.x + enemy.w >= enemy.maxX) {
            enemy.dir *= -1;
            enemy.x = clamp(enemy.x, enemy.minX, enemy.maxX - enemy.w);
          }
          handleEnemyCollision(enemy);
        }
      }

      function updateCoins() {
        world.coins.forEach(collectCoin);
      }

      function updateGoal() {
        const playerBox = { x: player.x, y: player.y, w: player.w, h: player.h };
        const goalBox = { x: world.goal.x, y: world.goal.y, w: world.goal.w, h: world.goal.h };
        if (rectsOverlap(playerBox, goalBox)) {
          state.score += 500;
          state.status = 'win';
          updateHud();
        }
      }

      function update() {
        if (state.status !== 'play') return;
        updatePlayer();
        updateEnemies();
        updateCoins();
        updateGoal();
        state.cameraX = clamp(player.x - canvas.width * 0.35, 0, world.width - canvas.width);
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#6ad5ff');
        sky.addColorStop(0.7, '#cdefff');
        sky.addColorStop(1, '#f6fbff');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffd95c';
        ctx.beginPath();
        ctx.arc(760, 82, 52, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for (let i = 0; i < 10; i++) {
          const x = ((i * 210) - (state.cameraX * 0.12)) % (canvas.width + 220) - 120;
          const y = 80 + (i % 3) * 32;
          ctx.beginPath();
          ctx.arc(x, y, 26, 0, Math.PI * 2);
          ctx.arc(x + 26, y - 8, 24, 0, Math.PI * 2);
          ctx.arc(x + 54, y + 2, 22, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#a5da9f';
        for (let i = 0; i < 12; i++) {
          const x = (i * 220) - (state.cameraX * 0.3);
          ctx.beginPath();
          ctx.moveTo(x, 470);
          ctx.lineTo(x + 70, 300);
          ctx.lineTo(x + 150, 470);
          ctx.fill();
        }
      }

      function drawPlatform(platform) {
        const x = platform.x - state.cameraX;
        const y = platform.y;

        if (platform.kind === 'pipe') {
          ctx.fillStyle = '#2ec96a';
          ctx.fillRect(x, y + 12, platform.w, platform.h - 12);
          ctx.fillStyle = '#1aa853';
          ctx.fillRect(x + 10, y, platform.w - 20, 14);
          ctx.fillStyle = '#9cf1be';
          ctx.fillRect(x + 16, y + 20, platform.w - 32, 8);
          return;
        }

        ctx.fillStyle = platform.kind === 'ground' ? '#54c14d' : '#cc7a35';
        ctx.fillRect(x, y, platform.w, platform.h);

        ctx.fillStyle = platform.kind === 'ground' ? '#2d7c2c' : '#9d5322';
        ctx.fillRect(x, y, platform.w, 8);

        if (platform.kind === 'step') {
          ctx.fillStyle = '#f8d88a';
          ctx.fillRect(x + 5, y + 6, platform.w - 10, 5);
        }
      }

      function drawCoins() {
        for (const coin of world.coins) {
          if (coin.collected) continue;
          const x = coin.x - state.cameraX;
          const y = coin.y;
          ctx.fillStyle = '#ffd85a';
          ctx.beginPath();
          ctx.arc(x, y, coin.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff3b0';
          ctx.fillRect(x - 2, y - 6, 4, 12);
        }
      }

      function drawEnemies() {
        for (const enemy of world.enemies) {
          if (!enemy.alive) continue;
          const x = enemy.x - state.cameraX;
          const y = enemy.y;

          ctx.fillStyle = '#db4a4a';
          ctx.fillRect(x, y, enemy.w, enemy.h);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x + 5, y + 8, 6, 6);
          ctx.fillRect(x + enemy.w - 11, y + 8, 6, 6);
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(x + 7, y + 10, 2, 2);
          ctx.fillRect(x + enemy.w - 9, y + 10, 2, 2);
          ctx.fillStyle = '#ffefef';
          ctx.fillRect(x + 9, y + 18, 10, 4);
        }
      }

      function drawGoal() {
        const x = world.goal.x - state.cameraX;
        const y = world.goal.y;

        ctx.fillStyle = '#ebf6ff';
        ctx.fillRect(x, y, 12, world.goal.h);
        ctx.fillStyle = '#ffd857';
        ctx.beginPath();
        ctx.moveTo(x + 12, y + 14);
        ctx.lineTo(x + 52, y + 30);
        ctx.lineTo(x + 12, y + 46);
        ctx.fill();
      }

      function drawPlayer() {
        const x = player.x - state.cameraX;
        const y = player.y;

        const blink = player.invuln > 0 && Math.floor(player.invuln / 6) % 2 === 0;
        if (blink) return;

        ctx.fillStyle = '#ffd59a';
        ctx.fillRect(x + 8, y + 4, 12, 12);
        ctx.fillStyle = '#f6aa28';
        ctx.fillRect(x + 6, y + 14, 16, 18);
        ctx.fillStyle = '#2b6df8';
        ctx.fillRect(x + 4, y + 18, 20, 14);

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x + 8, y + 8, 2, 2);
        ctx.fillRect(x + 17, y + 8, 2, 2);

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x + 7, y + 26, 5, 16); 
        ctx.fillRect(x + 16, y + 26, 5, 16);
        ctx.fillRect(x + 4, y + 30, 4, 12);
        ctx.fillRect(x + 20, y + 30, 4, 12);
      }

      function drawOverlay() {
        if (state.status === 'play') return;

        ctx.fillStyle = 'rgba(15, 24, 34, 0.18)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 46px Segoe UI';
        const title = state.status === 'title' ? 'Press any key to start' : state.status === 'win' ? 'You Win!' : 'Game Over';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 16);

        ctx.font = '700 18px Segoe UI';
        ctx.fillStyle = '#dfeeff';
        const sub = state.status === 'title' ? 'Use A/D or arrow keys to move' : 'Press restart or any key to play again';
        ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 24);
      }

      function render() {
        drawBackground();
        world.platforms.forEach(drawPlatform);
        drawCoins();
        drawEnemies();
        drawGoal();
        drawPlayer();
        drawOverlay();
      }

      function startGame() {
        state.status = 'play';
      }

      let lastTime = 0;
      function gameLoop(timestamp) {
        const dt = timestamp - lastTime || 16.67;
        lastTime = timestamp;

        if (state.status === 'play') {
          update();
        }

        render();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'a', 'd', 'w', 's'].includes(key) || event.code === 'Space') {
          event.preventDefault();
        }

        keys[key] = true;

        if (state.status !== 'play') {
          if (state.status === 'title' || state.status === 'gameover' || state.status === 'win') {
            if (state.status === 'gameover' || state.status === 'win') {
              resetGame();
            }
            startGame();
          }
        }
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        keys[key] = false;
      });

      restartBtn.addEventListener('click', () => {
        resetGame();
        startGame();
      });

      resetGame();
      updateHud();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
