<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101114" />
  <title>Orbit — AI chat and search</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#17181c;--panel2:#202126;--line:#303137;--text:#f2f2f3;--muted:#a5a6ad;--accent:#b9f4d0;--blue:#8eb8ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,textarea{font:inherit}button{color:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    aside{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;background:#131417}.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-size:17px;font-weight:700;letter-spacing:-.03em}.brand-icon{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#15211a;display:grid;place-items:center;font-size:18px}
    .new-chat{border:1px solid #44454c;background:transparent;border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center}.new-chat:hover,.search-button:hover{background:#24252a}.hint{color:var(--muted);font-size:12px;padding:0 9px;margin:2px 0}.sidebar-bottom{margin-top:auto;color:#85868e;font-size:12px;padding:10px}
    main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:#101114ee}.model{font-weight:600}.model small{font-weight:400;color:var(--muted);margin-left:6px}.top-actions{display:flex;gap:8px}.search-button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13px}
    .conversation{flex:1;overflow:auto;padding:30px 20px 24px}.inner{width:min(760px,100%);margin:0 auto}.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 0 70px}.welcome-mark{width:56px;height:56px;border-radius:20px;background:#242a27;color:var(--accent);display:grid;place-items:center;font-size:28px;margin-bottom:20px}.welcome h1{font-size:clamp(28px,5vw,42px);line-height:1.12;letter-spacing:-.045em;margin:0 0 10px}.welcome p{color:var(--muted);margin:0 0 28px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(620px,100%)}.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;color:#dedee2;font-size:13px}.suggestion:hover{border-color:#666870;background:#1d1e23}
    .messages{display:flex;flex-direction:column;gap:24px;padding-bottom:24px}.message{display:flex;gap:12px;align-items:flex-start}.avatar{flex:0 0 30px;height:30px;border-radius:10px;background:#28292f;display:grid;place-items:center;font-size:13px}.message.user .avatar{background:#303943;color:var(--blue)}.message-content{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}.message.assistant .message-content{color:#e5e5e8}.message-content p{margin:0 0 12px}.message-content p:last-child{margin-bottom:0}.status{color:var(--muted);font-size:13px;padding:0 0 12px 42px}
    .composer-wrap{padding:10px 20px 18px}.composer{width:min(760px,100%);margin:0 auto;border:1px solid #484950;border-radius:18px;background:#1c1d21;padding:10px 12px 8px;box-shadow:0 12px 40px #0003}.composer textarea{display:block;width:100%;resize:none;max-height:180px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:8px 5px}.composer textarea::placeholder{color:#909198}.composer-row{display:flex;align-items:center;justify-content:space-between}.composer-note{color:#85868e;font-size:11px;padding-left:4px}.tools{display:flex;gap:7px}.icon-button{width:36px;height:36px;border:0;border-radius:11px;background:transparent;color:#c5c6cb;display:grid;place-items:center}.icon-button:hover{background:#303137}.icon-button.active{color:var(--accent);background:#29352e}.send{background:var(--accent);color:#17221a;font-size:18px;font-weight:700}.send:hover{background:#d0f9df}.icon-button:disabled{opacity:.45;cursor:not-allowed}.disclaimer{text-align:center;color:#797a82;font-size:11px;margin:9px auto 0;max-width:760px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#2b2c31;border:1px solid #4a4b52;color:#eee;padding:10px 14px;border-radius:10px;font-size:13px;display:none;max-width:calc(100vw - 32px);z-index:5}
    @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.topbar{height:56px}.conversation{padding:22px 16px}.composer-wrap{padding:8px 12px 12px}.suggestions{grid-template-columns:1fr}.welcome{padding-bottom:30px}.top-actions .search-button{padding:7px 9px}}
  </style>
</head>
<body>
  <div class="app">
    <aside aria-label="Sidebar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✳</span> Orbit</div>
      <button class="new-chat" id="newChat"><span aria-hidden="true">＋</span> New chat</button>
      <p class="hint">Your chats will appear here.</p>
      <div class="sidebar-bottom">Ask, explore, and discover.<br>Voice input works in supported browsers.</div>
    </aside>
    <main>
      <header class="topbar"><div class="model">Orbit <small>AI assistant</small></div><div class="top-actions"><button class="search-button" id="googleSearch" type="button" title="Search Google">⌕ &nbsp;Google Search</button></div></header>
      <section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation">
        <div class="inner" id="content">
          <div class="welcome" id="welcome"><div class="welcome-mark" aria-hidden="true">✳</div><h1>What can I help with?</h1><p>Ask a question, explore an idea, or search the web.</p>
            <div class="suggestions"><button class="suggestion">Explain something complicated in simple terms</button><button class="suggestion">Help me plan a fun weekend</button><button class="suggestion">Give me ideas for a creative project</button><button class="suggestion">What should I learn next?</button></div>
          </div>
          <div class="messages" id="messages"></div><div class="status" id="status" hidden></div>
        </div>
      </section>
      <div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" aria-label="Message Orbit" placeholder="Message Orbit..."></textarea><div class="composer-row"><span class="composer-note">Ask anything</span><div class="tools"><button class="icon-button" id="mic" type="button" aria-label="Talk to Orbit" title="Talk to Orbit">🎙</button><button class="icon-button" id="speak" type="button" aria-label="Read answers aloud" title="Read answers aloud">🔊</button><button class="icon-button send" id="send" type="submit" aria-label="Send message">↑</button></div></div></form><p class="disclaimer">AI can make mistakes. Check important information.</p></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script>
(() => {
  // Connect this to your own server-side AI proxy. Keep API keys on the server, never in this page.
  const CHAT_API = '/api/chat';
  const form=document.getElementById('chatForm'), input=document.getElementById('prompt'), messages=document.getElementById('messages');
  const welcome=document.getElementById('welcome'), status=document.getElementById('status'), toast=document.getElementById('toast');
  let busy=false, latestAnswer='';
  function notify(text){toast.textContent=text;toast.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.style.display='none',3600)}
  function addMessage(role,text){
    welcome.hidden=true;
    const row=document.createElement('div');row.className='message '+role;
    const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=role==='user'?'You':'✳';
    const body=document.createElement('div');body.className='message-content';body.textContent=text;
    row.append(avatar,body);messages.append(row);document.getElementById('conversation').scrollTop=document.getElementById('conversation').scrollHeight;return body;
  }
  async function sendMessage(text){
    text=text.trim();if(!text||busy)return;
    addMessage('user',text);input.value='';resizeInput();busy=true;document.getElementById('send').disabled=true;
    status.hidden=false;status.textContent='Thinking…';
    try{
      const response=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      if(!response.ok)throw new Error('The AI service is not available yet.');
      const data=await response.json();const answer=data.reply||data.answer||data.message;
      if(typeof answer!=='string'||!answer)throw new Error('The AI service returned an empty answer.');
      latestAnswer=answer;addMessage('assistant',answer);
    }catch(error){
      const explanation=error instanceof TypeError
        ? 'Chat service is not connected yet. Add a server-side POST /api/chat endpoint that accepts {"message":"..."} and returns {"reply":"..."}. Google Search and voice input are available now.'
        : error.message;
      addMessage('assistant',explanation);
    }finally{busy=false;status.hidden=true;document.getElementById('send').disabled=false;input.focus()}
  }
  form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});
  function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'}
  input.addEventListener('input',resizeInput);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
  document.querySelectorAll('.suggestion').forEach(button=>button.addEventListener('click',()=>{input.value=button.textContent;form.requestSubmit()}));
  document.getElementById('newChat').addEventListener('click',()=>{messages.replaceChildren();welcome.hidden=false;latestAnswer='';input.focus()});
  document.getElementById('googleSearch').addEventListener('click',()=>{const query=input.value.trim()||latestAnswer;if(!query){notify('Type a question first, then choose Google Search.');input.focus();return}window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank','noopener,noreferrer')});
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=document.getElementById('mic');
  if(!SpeechRecognition){mic.addEventListener('click',()=>notify('Voice input is not supported in this browser. Try Chrome or Edge.'))}
  else{const recognition=new SpeechRecognition();recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.onstart=()=>mic.classList.add('active');recognition.onend=()=>mic.classList.remove('active');recognition.onerror=()=>notify('Could not hear that. Check microphone permission and try again.');recognition.onresult=e=>{input.value=(input.value+' '+e.results[0][0].transcript).trim();resizeInput();input.focus()};mic.addEventListener('click',()=>{try{recognition.start()}catch(_){recognition.stop()}})}
  document.getElementById('speak').addEventListener('click',()=>{if(!latestAnswer){notify('There is no answer to read aloud yet.');return}if(!('speechSynthesis'in window)){notify('Read aloud is not supported in this browser.');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(latestAnswer))});
})();
</script>
</body>
</html>
