<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Lab | Photo Editor</title>
    <style>
      :root {
        --bg: #070b14;
        --bg-2: #0f172a;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-2: rgba(17, 24, 39, 0.9);
        --panel-3: rgba(30, 41, 59, 0.75);
        --line: rgba(148, 163, 184, 0.18);
        --text: #edf3ff;
        --muted: #9aa8bf;
        --accent: #67e8f9;
        --accent-2: #8b5cf6;
        --orange: #f59e0b;
        --green: #34d399;
        --red: #fb7185;
        --shadow: rgba(2, 6, 23, 0.65);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background:
          radial-gradient(circle at 15% 20%, rgba(103, 232, 249, 0.12), transparent 18%),
          radial-gradient(circle at 85% 0%, rgba(139, 92, 246, 0.16), transparent 20%),
          linear-gradient(180deg, #070b14 0%, #0a1020 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(1500px, 100%);
        height: min(1000px, 94vh);
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 300px;
        background: rgba(5, 9, 18, 0.82);
        border: 1px solid var(--line);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.52);
      }

      .panel {
        background: rgba(15, 23, 42, 0.7);
        border-right: 1px solid var(--line);
      }

      .panel.right {
        border-right: none;
        border-left: 1px solid var(--line);
      }

      .left-panel, .right-panel {
        display: flex;
        flex-direction: column;
        padding: 18px 16px;
        gap: 18px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 18px rgba(103, 232, 249, 0.4);
      }

      .status-pill {
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--green);
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.25);
      }

      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }

      .card-header {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .card-body {
        padding: 14px;
      }

      .dropzone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 160px;
        border: 1.5px dashed rgba(103, 232, 249, 0.4);
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(103, 232, 249, 0.08), rgba(139, 92, 246, 0.08));
        cursor: pointer;
        padding: 18px 12px;
        text-align: center;
        transition: 0.2s ease;
      }

      .dropzone:hover,
      .dropzone.dragging {
        border-color: rgba(103, 232, 249, 0.8);
        background: linear-gradient(180deg, rgba(103, 232, 249, 0.12), rgba(139, 92, 246, 0.12));
        transform: translateY(-1px);
      }

      .dropzone .icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(103,232,249,0.2), rgba(139,92,246,0.22));
        display: grid;
        place-items: center;
        font-size: 1.4rem;
      }

      .dropzone strong {
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dropzone span {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.6;
      }

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      .preset-btn,
      .tool-btn {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(148, 163, 184, 0.05);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover,
      .preset-btn:hover,
      .tool-btn:hover {
        border-color: rgba(103, 232, 249, 0.4);
        background: rgba(103, 232, 249, 0.08);
      }

      .tool-btn.primary,
      .preset-btn.primary,
      button.primary {
        background: linear-gradient(135deg, rgba(103, 232, 249, 0.26), rgba(139, 92, 246, 0.3));
        border-color: rgba(103, 232, 249, 0.35);
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .control {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .control label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .control output {
        color: var(--text);
        font-weight: 800;
        min-width: 38px;
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #67e8f9;
      }

      .presets {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .preset-btn {
        padding: 8px 10px;
        border-radius: 10px;
      }

      .studio {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.62);
      }

      .tabbar {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tab {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(148, 163, 184, 0.04);
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .tab.active {
        color: var(--text);
        background: rgba(103, 232, 249, 0.08);
        border-color: rgba(103, 232, 249, 0.38);
      }

      .canvas-shell {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(180deg, rgba(15, 23, 42, 0.7), rgba(2, 6, 23, 0.95));
        padding: 18px;
      }

      .canvas-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 380px;
        background:
          linear-gradient(45deg, rgba(15, 23, 42, 0.75) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(15, 23, 42, 0.75) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(15, 23, 42, 0.75) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(15, 23, 42, 0.75) 75%);
        background-size: 26px 26px;
        background-position: 0 0, 0 13px, 13px -13px, -13px 0;
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 24px;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        text-align: center;
        opacity: 1;
        transition: 0.2s ease;
      }

      .empty-state.hidden {
        opacity: 0;
      }

      .right-panel .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(148,163,184,0.04);
        border: 1px solid transparent;
      }

      .list li.active {
        border-color: rgba(103, 232, 249, 0.35);
        background: rgba(103, 232, 249, 0.06);
      }

      .mini-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      }

      .mini-dot.orange { background: var(--orange); box-shadow: 0 0 12px rgba(245, 158, 11, 0.8); }
      .mini-dot.purple { background: var(--accent-2); box-shadow: 0 0 12px rgba(139, 92, 246, 0.8); }
      .mini-dot.red { background: var(--red); box-shadow: 0 0 12px rgba(251, 113, 133, 0.8); }

      .meta-block {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        background: rgba(148,163,184,0.04);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
      }

      .stat .label {
        color: var(--muted);
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .stat .value {
        font-weight: 800;
      }

      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 1fr;
          height: auto;
        }

        .panel.right,
        .panel.left {
          border: none;
          border-bottom: 1px solid var(--line);
        }

        .canvas-shell {
          min-height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel left">
        <div class="left-panel">
          <div class="brand-row">
            <div class="brand">
              <div class="brand-mark"></div>
              <span>Pixel Lab</span>
            </div>
            <div class="status-pill">Live</div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Import</span>
              <span>Drop</span>
            </div>
            <div class="card-body">
              <label class="dropzone" id="dropZone" for="imageLoader">
                <input id="imageLoader" type="file" accept="image/*" hidden />
                <div class="icon">⬆</div>
                <strong>Drop image here</strong>
                <span>or click to browse from your device</span>
              </label>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Actions</span>
            </div>
            <div class="card-body quick-actions">
              <button type="button" id="resetBtn">Reset</button>
              <button type="button" id="rotateLeftBtn">Rotate -90°</button>
              <button type="button" id="rotateRightBtn">Rotate +90°</button>
              <button type="button" id="flipHBtn">Flip H</button>
              <button type="button" id="flipVBtn">Flip V</button>
              <button type="button" class="primary" id="downloadBtn">Export</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Adjustments</span>
            </div>
            <div class="card-body controls">
              <div class="control">
                <label for="brightness"><span>Brightness</span><output id="brightnessValue">100%</output></label>
                <input id="brightness" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="contrast"><span>Contrast</span><output id="contrastValue">100%</output></label>
                <input id="contrast" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="saturation"><span>Saturation</span><output id="saturationValue">100%</output></label>
                <input id="saturation" type="range" min="0" max="200" value="100" />
              </div>
              <div class="control">
                <label for="warmth"><span>Warmth</span><output id="warmthValue">0%</output></label>
                <input id="warmth" type="range" min="-100" max="100" value="0" />
              </div>
              <div class="control">
                <label for="blur"><span>Blur</span><output id="blurValue">0px</output></label>
                <input id="blur" type="range" min="0" max="10" value="0" step="0.5" />
              </div>
              <div class="control">
                <label for="grayscale"><span>Mono</span><output id="grayscaleValue">0%</output></label>
                <input id="grayscale" type="range" min="0" max="100" value="0" />
              </div>
              <div class="control">
                <label for="hue"><span>Hue</span><output id="hueValue">0°</output></label>
                <input id="hue" type="range" min="0" max="360" value="0" />
              </div>
              <div class="control">
                <label for="vignette"><span>Vignette</span><output id="vignetteValue">0%</output></label>
                <input id="vignette" type="range" min="0" max="100" value="0" />
              </div>
            </div>
          </div>
        </div>
      </aside>

      <main class="studio">
        <div class="topbar">
          <div class="tabbar">
            <div class="tab active">Edit</div>
            <div class="tab">Layers</div>
            <div class="tab">History</div>
          </div>
          <div class="quick-actions">
            <button type="button" id="zoomOutBtn">− Zoom</button>
            <button type="button" id="zoomInBtn">+ Zoom</button>
          </div>
        </div>

        <div class="canvas-shell">
          <div class="canvas-wrap">
            <canvas id="editorCanvas" width="1200" height="760"></canvas>
            <div class="empty-state" id="emptyState">Drop a photo to begin editing</div>
          </div>
        </div>
      </main>

      <aside class="panel right">
        <div class="right-panel">
          <div class="card">
            <div class="card-header">
              <span>Presets</span>
            </div>
            <div class="card-body presets">
              <button type="button" class="preset-btn primary" data-preset="original">Original</button>
              <button type="button" class="preset-btn" data-preset="vivid">Vivid</button>
              <button type="button" class="preset-btn" data-preset="cinematic">Cinematic</button>
              <button type="button" class="preset-btn" data-preset="mono">Mono</button>
              <button type="button" class="preset-btn" data-preset="warm">Warm</button>
              <button type="button" class="preset-btn" data-preset="cool">Cool</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Layers</span>
            </div>
            <div class="card-body">
              <ul class="list">
                <li class="active"><span><span class="mini-dot"></span> Background</span><span>Locked</span></li>
                <li><span><span class="mini-dot orange"></span> Highlights</span><span>5%</span></li>
                <li><span><span class="mini-dot purple"></span> Glow</span><span>12%</span></li>
                <li><span><span class="mini-dot red"></span> Mask</span><span>Off</span></li>
              </ul>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Photo info</span>
            </div>
            <div class="card-body meta-block">
              <div class="stat">
                <div class="label">Zoom</div>
                <div class="value" id="zoomValue">100%</div>
              </div>
              <div class="stat">
                <div class="label">Rotation</div>
                <div class="value" id="rotationValue">0°</div>
              </div>
              <div class="stat">
                <div class="label">Format</div>
                <div class="value" id="formatValue">None</div>
              </div>
              <div class="stat">
                <div class="label">Quality</div>
                <div class="value">8/10</div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script>
      const canvas = document.getElementById('editorCanvas');
      const ctx = canvas.getContext('2d');
      const emptyState = document.getElementById('emptyState');
      const dropZone = document.getElementById('dropZone');
      const imageLoader = document.getElementById('imageLoader');

      const controls = {
        brightness: document.getElementById('brightness'),
        contrast: document.getElementById('contrast'),
        saturation: document.getElementById('saturation'),
        warmth: document.getElementById('warmth'),
        blur: document.getElementById('blur'),
        grayscale: document.getElementById('grayscale'),
        hue: document.getElementById('hue'),
        vignette: document.getElementById('vignette')
      };

      const outputs = {
        brightness: document.getElementById('brightnessValue'),
        contrast: document.getElementById('contrastValue'),
        saturation: document.getElementById('saturationValue'),
        warmth: document.getElementById('warmthValue'),
        blur: document.getElementById('blurValue'),
        grayscale: document.getElementById('grayscaleValue'),
        hue: document.getElementById('hueValue'),
        vignette: document.getElementById('vignetteValue')
      };

      const state = {
        image: null,
        zoom: 1,
        rotation: 0,
        flipX: false,
        flipY: false,
        panX: 0,
        panY: 0,
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function buildFilterString() {
        const brightness = Number(controls.brightness.value);
        const contrast = Number(controls.contrast.value);
        const saturation = Number(controls.saturation.value);
        const grayscale = Number(controls.grayscale.value);
        const blur = Number(controls.blur.value);
        const hue = Number(controls.hue.value);
        const warmth = Number(controls.warmth.value);

        let warmthFilter = '0';
        if (warmth > 0) warmthFilter = `saturate(${1 + warmth / 200})`;
        if (warmth < 0) warmthFilter = `saturate(${1 + warmth / 300})`;

        const filterString = [
          `brightness(${brightness}%)`,
          `contrast(${contrast}%)`,
          `saturate(${saturation}%)`,
          `grayscale(${grayscale}%)`,
          `hue-rotate(${hue}deg)`,
          `blur(${blur}px)`,
          warmthFilter
        ].join(' ');

        return filterString;
      }

      function updateOutputs() {
        outputs.brightness.textContent = `${controls.brightness.value}%`;
        outputs.contrast.textContent = `${controls.contrast.value}%`;
        outputs.saturation.textContent = `${controls.saturation.value}%`;
        outputs.warmth.textContent = `${controls.warmth.value}%`;
        outputs.blur.textContent = `${Number(controls.blur.value).toFixed(1)}px`;
        outputs.grayscale.textContent = `${controls.grayscale.value}%`;
        outputs.hue.textContent = `${controls.hue.value}°`;
        outputs.vignette.textContent = `${controls.vignette.value}%`;
        document.getElementById('zoomValue').textContent = `${Math.round(state.zoom * 100)}%`;
        document.getElementById('rotationValue').textContent = `${state.rotation}°`;
      }

      function renderCanvas() {
        updateOutputs();
        const { width, height } = canvas;
        ctx.clearRect(0, 0, width, height);

        if (!state.image) {
          return;
        }

        const img = state.image;
        const maxWidth = width * 0.85;
        const maxHeight = height * 0.8;
        const aspectRatio = img.width / img.height;

        let drawWidth = maxWidth;
        let drawHeight = drawWidth / aspectRatio;

        if (drawHeight > maxHeight) {
          drawHeight = maxHeight;
          drawWidth = drawHeight * aspectRatio;
        }

        drawWidth *= state.zoom;
        drawHeight *= state.zoom;

        const offsetX = width / 2 + state.panX;
        const offsetY = height / 2 + state.panY;

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.rotate((state.rotation * Math.PI) / 180);
        ctx.scale(state.flipX ? -1 : 1, state.flipY ? -1 : 1);
        ctx.translate(-drawWidth / 2, -drawHeight / 2);
        ctx.filter = buildFilterString();
        ctx.drawImage(img, 0, 0, drawWidth, drawHeight);
        ctx.restore();

        const vignetteAmount = Number(controls.vignette.value) / 100;
        if (vignetteAmount > 0) {
          const gradient = ctx.createRadialGradient(
            width / 2,
            height / 2,
            Math.min(width, height) * 0.18,
            width / 2,
            height / 2,
            Math.max(width, height) * 0.75
          );

          gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
          gradient.addColorStop(1, `rgba(0, 0, 0, ${0.45 + vignetteAmount * 0.55})`);
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function updateImageMetadata(fileName) {
        document.getElementById('formatValue').textContent = fileName ? fileName.split('.').pop().toUpperCase() : 'None';
      }

      function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) {
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.image = img;
            emptyState.classList.add('hidden');
            updateImageMetadata(file.name);
            renderCanvas();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }

      function handleFiles(files) {
        const file = files && files[0];
        handleImageFile(file);
      }

      Object.values(controls).forEach((input) => {
        input.addEventListener('input', renderCanvas);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        Object.entries(controls).forEach(([key, input]) => {
          if (key === 'brightness') input.value = 100;
          if (key === 'contrast') input.value = 100;
          if (key === 'saturation') input.value = 100;
          if (key === 'warmth') input.value = 0;
          if (key === 'blur') input.value = 0;
          if (key === 'grayscale') input.value = 0;
          if (key === 'hue') input.value = 0;
          if (key === 'vignette') input.value = 0;
        });

        state.zoom = 1;
        state.rotation = 0;
        state.flipX = false;
        state.flipY = false;
        state.panX = 0;
        state.panY = 0;
        renderCanvas();
      });

      document.getElementById('rotateLeftBtn').addEventListener('click', () => {
        state.rotation = (state.rotation - 90 + 360) % 360;
        renderCanvas();
      });

      document.getElementById('rotateRightBtn').addEventListener('click', () => {
        state.rotation = (state.rotation + 90) % 360;
        renderCanvas();
      });

      document.getElementById('flipHBtn').addEventListener('click', () => {
        state.flipX = !state.flipX;
        renderCanvas();
      });

      document.getElementById('flipVBtn').addEventListener('click', () => {
        state.flipY = !state.flipY;
        renderCanvas();
      });

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        state.zoom = clamp(state.zoom + 0.1, 0.5, 2.5);
        renderCanvas();
      });

      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        state.zoom = clamp(state.zoom - 0.1, 0.5, 2.5);
        renderCanvas();
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!state.image) return;

        const exportCanvas = document.createElement('canvas');
        const img = state.image;
        const exportCtx = exportCanvas.getContext('2d');

        const ratio = img.width / img.height;
        const width = 2000;
        const height = Math.round(width / ratio);

        exportCanvas.width = width;
        exportCanvas.height = height;

        exportCtx.clearRect(0, 0, width, height);
        exportCtx.save();
        exportCtx.translate(width / 2, height / 2);
        exportCtx.rotate((state.rotation * Math.PI) / 180);
        exportCtx.scale(state.flipX ? -1 : 1, state.flipY ? -1 : 1);
        exportCtx.filter = buildFilterString();
        exportCtx.drawImage(img, -width / 2, -height / 2, width, height);
        exportCtx.restore();

        const vignetteAmount = Number(controls.vignette.value) / 100;
        if (vignetteAmount > 0) {
          const gradient = exportCtx.createRadialGradient(
            width / 2,
            height / 2,
            Math.min(width, height) * 0.18,
            width / 2,
            height / 2,
            Math.max(width, height) * 0.75
          );
          gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
          gradient.addColorStop(1, `rgba(0, 0, 0, ${0.45 + vignetteAmount * 0.55})`);
          exportCtx.fillStyle = gradient;
          exportCtx.fillRect(0, 0, width, height);
        }

        const link = document.createElement('a');
        link.download = 'edited-photo.png';
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
      });

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => {
          const preset = button.dataset.preset;
          const presets = {
            original: { brightness: 100, contrast: 100, saturation: 100, warmth: 0, blur: 0, grayscale: 0, hue: 0, vignette: 0 },
            vivid: { brightness: 110, contrast: 125, saturation: 150, warmth: 12, blur: 0, grayscale: 0, hue: 0, vignette: 4 },
            cinematic: { brightness: 95, contrast: 135, saturation: 105, warmth: 18, blur: 0.5, grayscale: 0, hue: 8, vignette: 18 },
            mono: { brightness: 108, contrast: 120, saturation: 20, warmth: 0, blur: 0, grayscale: 78, hue: 0, vignette: 8 },
            warm: { brightness: 112, contrast: 120, saturation: 130, warmth: 30, blur: 0, grayscale: 0, hue: 12, vignette: 6 },
            cool: { brightness: 96, contrast: 110, saturation: 90, warmth: -20, blur: 0, grayscale: 0, hue: 190, vignette: 10 }
          };

          const values = presets[preset];
          Object.entries(values).forEach(([key, value]) => {
            controls[key].value = value;
          });

          renderCanvas();
        });
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add('dragging');
        });
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove('dragging');
        });
      });

      dropZone.addEventListener('drop', (event) => {
        handleFiles(event.dataTransfer.files);
      });

      imageLoader.addEventListener('change', (event) => {
        handleFiles(event.target.files);
      });

      renderCanvas();
    </script>
  </body>
</html>
