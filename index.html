<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Sprint</title>
  <style>
    :root {
      --sky1: #0d1b2a;
      --sky2: #1d3557;
      --sky3: #457b9d;
      --ground: #2d6a4f;
      --groundDark: #1e4d3b;
      --player: #ef476f;
      --playerDark: #d72638;
      --coin: #ffd166;
      --enemy: #ef233c;
      --cloud: rgba(255, 255, 255, 0.8);
      --panel: rgba(9, 15, 27, 0.45);
      --text: #eef6ff;
      --button: #ffd166;
      --buttonDark: #f4b942;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d3557 0%, #0d1b2a 60%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .game-shell {
      position: relative;
      width: min(94vw, 960px);
      height: min(72vw, 540px);
      max-height: 540px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      background: linear-gradient(180deg, var(--sky2) 0%, var(--sky3) 40%, #d8f3dc 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--sky2) 0%, var(--sky3) 48%, #8ecae6 100%);
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .hud div {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      backdrop-filter: blur(4px);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(9, 15, 27, 0.45);
      z-index: 20;
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      background: rgba(15, 25, 38, 0.8);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 26px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel p {
      margin: 0 0 18px;
      color: #eaf4ff;
      font-size: 1rem;
    }

    .play-button {
      border: none;
      background: linear-gradient(180deg, var(--button), var(--buttonDark));
      color: #1d1d1d;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 25px rgba(244, 185, 66, 0.35);
    }

    .play-button:hover {
      transform: translateY(-2px);
    }

    .play-button:active {
      transform: translateY(1px);
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(11, 14, 22, 0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Coins: <span id="coinCount">0</span></div>
      <div>Best: <span id="bestScore">0</span></div>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>Sky Sprint</h1>
        <p>Jump over obstacles and collect coins.</p>
        <button id="playButton" class="play-button">Play</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div class="message" id="message">Press Space to Start</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const coinEl = document.getElementById('coinCount');
    const bestEl = document.getElementById('bestScore');
    const messageEl = document.getElementById('message');
    const startOverlay = document.getElementById('startOverlay');
    const playButton = document.getElementById('playButton');

    const groundY = canvas.height - 60;
    const game = {
      running: false,
      over: false,
      score: 0,
      coins: 0,
      best: Number(localStorage.getItem('sky-sprint-best') || 0),
      distance: 0,
      speed: 7,
      lastSpawn: 0,
      coinTimer: 0,
      camera: 0,
      flashTimer: 0
    };

    const player = {
      x: 90,
      y: groundY - 52,
      w: 38,
      h: 52,
      vx: 0,
      vy: 0,
      grounded: true,
      jumpForce: -15.5,
      gravity: 0.72
    };

    const obstacles = [];
    const pickups = [];
    const clouds = [];
    const particles = [];

    function resetState() {
      game.running = true;
      game.over = false;
      game.score = 0;
      game.coins = 0;
      game.distance = 0;
      game.camera = 0;
      game.lastSpawn = 0;
      game.coinTimer = 0;
      game.flashTimer = 0;
      obstacles.length = 0;
      pickups.length = 0;
      particles.length = 0;
      player.x = 90;
      player.y = groundY - player.h;
      player.vy = 0;
      player.grounded = true;
      messageEl.textContent = 'Run!';
      scoreEl.textContent = '0';
      coinEl.textContent = '0';
      startOverlay.classList.add('hidden');
    }

    function updateBest() {
      if (game.score > game.best) {
        game.best = Math.floor(game.score);
        localStorage.setItem('sky-sprint-best', String(game.best));
      }
      bestEl.textContent = game.best;
    }

    function spawnCloud() {
      clouds.push({
        x: canvas.width + Math.random() * 200,
        y: 40 + Math.random() * 170,
        r: 20 + Math.random() * 40,
        speed: 0.5 + Math.random() * 1.3
      });
    }

    function spawnObstacle() {
      const type = Math.random() < 0.5 ? 'block' : 'spike';
      const h = type === 'block' ? 40 + Math.random() * 30 : 22 + Math.random() * 22;
      const y = groundY - h;
      const w = type === 'block' ? 28 + Math.random() * 20 : 20 + Math.random() * 18;
      obstacles.push({
        x: canvas.width + 30,
        y,
        w,
        h,
        type,
        color: type === 'block' ? '#ef233c' : '#f94144'
      });
    }

    function spawnPickup() {
      pickups.push({
        x: canvas.width + 40,
        y: groundY - (50 + Math.random() * 160),
        r: 10,
        collected: false
      });
    }

    function addBurst(x, y, color, amount = 12) {
      for (let i = 0; i < amount; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 20 + Math.random() * 20,
          size: 3 + Math.random() * 5,
          color
        });
      }
    }

    function jump() {
      if (!game.running || game.over) return;
      if (player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
      }
    }

    function startGame() {
      if (game.running && !game.over) return;
      resetState();
      updateBest();
    }

    function endGame() {
      game.over = true;
      game.running = false;
      updateBest();
      messageEl.textContent = 'Game Over! Press Space';
      startOverlay.classList.remove('hidden');
      playButton.textContent = 'Play Again';
      document.querySelector('.panel h1').textContent = 'Game Over';
      document.querySelector('.panel p').textContent = 'You crashed! Hit play to restart.';
    }

    function handleInput(event) {
      if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
        event.preventDefault();
        if (!game.running) {
          startGame();
        } else {
          jump();
        }
      }
    }

    function checkCollisionRect(x1, y1, w1, h1, x2, y2, w2, h2) {
      return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
    }

    function update() {
      if (!game.running) return;

      game.score += 0.25;
      game.distance += game.speed;
      game.camera += game.speed;

      if (game.camera > 200) {
        game.camera = 0;
        spawnCloud();
      }

      game.lastSpawn += 1;
      game.coinTimer += 1;

      if (game.lastSpawn > 90) {
        spawnObstacle();
        game.lastSpawn = 0;
      }

      if (game.coinTimer > 65) {
        spawnPickup();
        game.coinTimer = 0;
      }

      for (let i = clouds.length - 1; i >= 0; i--) {
        const cloud = clouds[i];
        cloud.x -= cloud.speed;
        if (cloud.x < -200) clouds.splice(i, 1);
      }

      player.vy += player.gravity;
      player.y += player.vy;

      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= game.speed;

        if (checkCollisionRect(player.x, player.y, player.w, player.h, obs.x, obs.y, obs.w, obs.h)) {
          addBurst(player.x + player.w / 2, player.y + player.h / 2, '#ef476f', 18);
          endGame();
          return;
        }

        if (obs.x + obs.w < -10) {
          obstacles.splice(i, 1);
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const coin = pickups[i];
        coin.x -= game.speed;

        const hit = Math.hypot(
          player.x + player.w / 2 - coin.x,
          player.y + player.h / 2 - coin.y
        ) < 22;

        if (hit) {
          game.coins += 1;
          game.score += 25;
          coinEl.textContent = game.coins;
          scoreEl.textContent = Math.floor(game.score);
          addBurst(coin.x, coin.y, '#ffd166', 12);
          pickups.splice(i, 1);
        } else if (coin.x < -20) {
          pickups.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      scoreEl.textContent = Math.floor(game.score);
      coinEl.textContent = game.coins;
      updateBest();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#1d3557');
      sky.addColorStop(0.55, '#457b9d');
      sky.addColorStop(1, '#d8f3dc');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(32, 60, 91, 0.7)';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let x = 0; x <= canvas.width; x += 120) {
        const y = 260 + (x % 240 === 0 ? 40 : 0);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();

      for (const cloud of clouds) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.8, cloud.y + 10, cloud.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGround() {
      ctx.fillStyle = '#2d6a4f';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#1e4d3b';
      for (let x = 0; x < canvas.width + 40; x += 32) {
        ctx.fillRect(x, groundY + 18, 12, 8);
      }
    }

    function drawPlayer() {
      const px = player.x;
      const py = player.y;

      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(px + player.w / 2, groundY + 10, 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = player.grounded ? '#f43f5e' : '#ff6b6b';
      ctx.fillRect(px + 8, py + 10, 22, 28);

      ctx.fillStyle = '#ffd6a5';
      ctx.beginPath();
      ctx.arc(px + 19, py + 8, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(px + 13, py + 4, 4, 4);
      ctx.fillRect(px + 22, py + 4, 4, 4);

      ctx.strokeStyle = '#1d3557';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px + 13, py + 38);
      ctx.lineTo(px + 8, py + 48);
      ctx.moveTo(px + 25, py + 38);
      ctx.lineTo(px + 30, py + 48);
      ctx.stroke();
    }

    function drawObstacle(obs) {
      if (obs.type === 'block') {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      } else {
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y + obs.h);
        ctx.lineTo(obs.x + obs.w / 2, obs.y);
        ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPickup(coin) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(coin.x - 2, coin.y - 7, 4, 14);
      ctx.fillRect(coin.x - 7, coin.y - 2, 14, 4);
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }
    }

    function render() {
      drawBackground();
      drawGround();

      for (const obs of obstacles) drawObstacle(obs);
      for (const coin of pickups) drawPickup(coin);
      drawParticles();
      drawPlayer();
    }

    function tick() {
      update();
      render();
      requestAnimationFrame(tick);
    }

    function resetOverlayText() {
      document.querySelector('.panel h1').textContent = 'Sky Sprint';
      document.querySelector('.panel p').textContent = 'Jump over obstacles and collect coins.';
      playButton.textContent = 'Play';
    }

    playButton.addEventListener('click', () => {
      resetOverlayText();
      startGame();
    });

    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('pointerdown', () => {
      if (!game.running) {
        startGame();
      } else if (!game.over) {
        jump();
      }
    });

    for (let i = 0; i < 8; i++) spawnCloud();
    updateBest();
    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
