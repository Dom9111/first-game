<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mom Hits Counter</title>
    <style>
      :root {
        --bg1: #fff1f6;
        --bg2: #ffd7e5;
        --card: rgba(255,255,255,0.8);
        --ink: #2d1c2d;
        --accent: #d94f7c;
        --accent2: #8a4de0;
        --line: rgba(45, 28, 45, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--bg1), var(--bg2));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      .app {
        width: min(440px, 90vw);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow: 0 30px 80px rgba(80, 35, 59, 0.12);
        padding: 28px 22px 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        letter-spacing: -0.04em;
      }

      .count {
        font-size: clamp(4rem, 12vw, 6rem);
        font-weight: 900;
        line-height: 1;
        margin: 18px 0 20px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      button {
        border: none;
        cursor: pointer;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 15px 24px;
        box-shadow: 0 14px 28px rgba(134, 83, 170, 0.2);
      }

      .reset {
        background: linear-gradient(135deg, #555c73, #7c6f98);
      }

      .sub {
        margin-top: 16px;
        font-size: 0.92rem;
        color: rgba(45, 28, 45, 0.75);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Every time mom hits you</h1>
      <div class="count" id="count">0</div>

      <div class="button-row">
        <button id="hitBtn" type="button">Hit</button>
        <button id="resetBtn" class="reset" type="button">Reset</button>
      </div>

      <div class="sub">Tap the button to count the hits.</div>
    </div>

    <script>
      const countEl = document.getElementById('count');
      const hitBtn = document.getElementById('hitBtn');
      const resetBtn = document.getElementById('resetBtn');
      let count = 0;

      function updateCount() {
        countEl.textContent = count;
      }

      hitBtn.addEventListener('click', () => {
        count += 1;
        updateCount();
      });

      resetBtn.addEventListener('click', () => {
        count = 0;
        updateCount();
      });
    </script>
  </body>
</html>
